<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Driver Dashboard</title>
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>

   :root {
  --main-green: #1b8f2a;
  --white: #ffffff;
   }
body { font-family: Arial, sans-serif; margin:0; padding:20px; background:#f5f5f5; }
.container { max-width:600px; margin:auto; background:white; padding:22px; border-radius:10px; box-shadow:0 3px 10px rgba(0,0,0,0.12); }
h2 { color:#1b8f2a; text-align:center; margin-bottom:20px; }
input { width:100%; padding:12px; border:2px solid #1b8f2a; border-radius:8px; font-size:16px; margin-bottom:20px; }
button { width:100%; background:#1b8f2a; color:white; padding:14px; border:none; border-radius:8px; font-size:18px; cursor:pointer; }
button:active { background:#166d20; }
.driver-card { display:flex; align-items:center; gap:15px; margin-top:20px; padding:12px; border:1px solid #1b8f2a; border-radius:8px; }
.driver-card img { width:60px; height:60px; border-radius:50%; object-fit:cover; border:2px solid #1b8f2a; }
.msg { margin-top:10px; font-weight:bold; color:red; }
 /* HEADER */
header {
  background-color: var(--main-green);
  color: var(--white);
  padding: 15px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: relative;
}

 header .logo {
  display: flex;
  align-items: center;
}

header .logo img {
  height: 32px;
  width: auto;
  object-fit: contain;
 }

 @media (max-width: 480px) {
  header .logo img {
    height: 28px;
  }
        }

header .menu-icon {
  font-size: 24px;
  cursor: pointer;
  display: none;
}

nav {
  display: flex;
  gap: 20px;
}

nav a {
  color: var(--white);
  text-decoration: none;
  font-weight: 500;
}

nav.active {
  display: block;
  position: absolute;
  top: 60px;
  right: 20px;
  background-color: var(--main-green);
  padding: 15px;
  border-radius: 5px;
  width: 150px;
}

nav.active a {
  display: block;
  margin: 10px 0;
}

/* RESPONSIVE */
@media screen and (max-width: 768px) {
  nav {
    display: none;
    flex-direction: column;
  }
  header .menu-icon {
    display: block;
  }
}

/* FOOTER */
footer {
  background-color: var(--main-green);
  color: var(--white);
  text-align: center;
  padding: 15px;
  margin-top: auto;
  } 
 .car-card {
  display: flex;
  align-items: center;
  gap: 15px;
  margin-top: 15px;
  padding: 12px;
  border: 1px solid #1b8f2a;
  border-radius: 8px;
  background: #f9f9f9;
}
.car-card img {
  width: 60px;
  height: 60px;
  border-radius: 8px;
  object-fit: cover;
  border: 2px solid #1b8f2a;
 }
</style>
</head>
<body>
<header>
  <div class="logo">
  <img src="assets/logo/d4d-logo.png" alt="D4D Logo">
  </div>
  <div class="menu-icon" id="menuToggle"><i class="fas fa-bars"></i></div>
  <nav id="navMenu">
    <a href="#">Home</a>
    <a href="#">Login</a>
    <a href="#">About</a>
  </nav>
</header>


<div class="container">
  <h2>Driver Dashboard</h2>
  
  <label>Search by Number Plate</label>
  <input type="text" id="search_plate" placeholder="Enter number plate">
  <button onclick="searchDriver()">Search</button>
  
  <div id="result"></div>
  <div id="msg" class="msg"></div>

<h2>Available Cars</h2>
<div id="availableCars" style="margin-top:20px;"></div>
</div>
<footer>
  &copy; 2025 Driver App. All rights reserved.
</footer>
<script>
async function searchDriver(){
    const plate = document.getElementById("search_plate").value.trim();
    const msg = document.getElementById("msg");
    const result = document.getElementById("result");
    result.innerHTML = "";
    msg.textContent = "";

    if(!plate){
        msg.textContent = "Please enter a number plate.";
        return;
    }

    try{
        const res = await fetch(`https://drivers-backend-4spp.onrender.com/search-driver?number_plate=${encodeURIComponent(plate)}`);
        const data = await res.json();

        if(!data.success){
            msg.textContent = data.error || "Driver not found.";
            return;
        }

        // Display driver info
        const driver = data.driver;
        result.innerHTML = `
            <div class="driver-card">
                <img src="${driver.profile_pic_url || 'https://via.placeholder.com/60'}" alt="Profile">
                <div>
                    <strong>${driver.full_name}</strong><br>
                    ${driver.number_plate}
                </div>
            </div>
        `;

    }catch(e){
        msg.textContent = "Network error. Try again.";
    }
}

  /* RESPONSIVE MENU */
const menuToggle = document.getElementById('menuToggle');
const navMenu = document.getElementById('navMenu');

menuToggle.addEventListener('click', () => {
  navMenu.classList.toggle('active');
  if (navMenu.classList.contains('active')) {
    menuToggle.innerHTML = '<i class="fas fa-times"></i>';
  } else {
    menuToggle.innerHTML = '<i class="fas fa-bars"></i>';
  }
});


 async function loadAvailableCars() {
    const container = document.getElementById("availableCars");
    container.innerHTML = ""; // clear previous

    try {
        const res = await fetch("https://drivers-backend-4spp.onrender.com/available-cars");
        const data = await res.json();

        if(!data.success || !data.cars.length){
            container.innerHTML = "<p>No available cars found.</p>";
            return;
        }

        data.cars.forEach(car => {
            const card = document.createElement("div");
            card.className = "car-card";
            card.innerHTML = `
                <img src="${car.car_image_url || 'https://via.placeholder.com/60'}" alt="Car">
                <div>
                    <strong>${car.car_make} ${car.car_model}</strong><br>
                    ${car.number_plate}
                </div>
            `;
            container.appendChild(card);
        });

    } catch (e) {
        container.innerHTML = "<p>Failed to load available cars. Try again later.</p>";
        console.error(e);
    }
}

// Load cars on page load
window.addEventListener("DOMContentLoaded", loadAvailableCars);
</script>

</body>
</html>
