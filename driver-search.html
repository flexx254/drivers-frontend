<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Driver Dashboard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root {
  --main-green: #1b8f2a;
  --white: #ffffff;
}

body { font-family: Arial, sans-serif; margin:0; padding:20px; background:#f5f5f5; }

.container {
  max-width:600px;
  margin:auto;
  background:white;
  padding:22px;
  border-radius:10px;
  box-shadow:0 3px 10px rgba(0,0,0,0.12);
}

h2 { color:#1b8f2a; text-align:center; margin-bottom:20px; }

input {
  width:100%;
  padding:12px;
  border:2px solid #1b8f2a;
  border-radius:8px;
  font-size:16px;
  margin-bottom:20px;
}

button {
  width:100%;
  background:#1b8f2a;
  color:white;
  padding:14px;
  border:none;
  border-radius:8px;
  font-size:18px;
  cursor:pointer;
}

/* Buttons inside cards should NOT stretch full width */
.connect-btn,
.small-btn {
  width: auto;
  font-size: 14px;
  padding: 8px 12px;
}

button:active { background:#166d20; }

.driver-card {
  display:flex;
  align-items:center;
  gap:15px;
  margin-top:20px;
  padding:12px;
  border:1px solid #1b8f2a;
  border-radius:8px;
}

.driver-card img {
  width:60px;
  height:60px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #1b8f2a;
}

.msg { margin-top:10px; font-weight:bold; color:red; }

/* STATUS BOX */
.status-box{
  text-align:center;
  padding:12px;
  border-radius:8px;
  font-weight:bold;
  margin-bottom:15px;
}

.status-complete{
  background:#e6f7ea;
  color:var(--main-green);
  border:1px solid var(--main-green);
}

.status-incomplete{
  background:#ffe6e6;
  color:red;
  border:1px solid red;
}

.status-incomplete a{
  color:red;
  text-decoration:none;
  font-weight:bold;
}

.partner-login-link {
  display: block;
  margin-top: 10px;
  color: var(--main-green) !important;
  text-decoration: none;
  font-weight: bold;
  font-size: 14px;
}

.partner-login-link:hover {
  text-decoration: underline;
  }
               
/* HEADER */
header {
  background-color: var(--main-green);
  color: var(--white);
  padding: 15px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: relative;
}

header .logo img {
  height: 32px;
}

header .menu-icon {
  font-size: 24px;
  cursor: pointer;
  display: none;
}

nav {
  display: flex;
  gap: 20px;
}

nav a {
  color: var(--white);
  text-decoration: none;
}

nav.active {
  display: block;
  position: absolute;
  top: 60px;
  right: 20px;
  background-color: var(--main-green);
  padding: 15px;
  border-radius: 5px;
  width: 150px;
}

nav.active a {
  display: block;
  margin: 10px 0;
}

@media screen and (max-width: 768px) {
  nav { display:none; flex-direction:column; }
  header .menu-icon { display:block; }
}

/* FOOTER */
footer {
  background-color: var(--main-green);
  color: var(--white);
  text-align: center;
  padding: 15px;
  margin-top: auto;
}

.car-card {
  display:flex;
  align-items:center;
  gap:15px;
  margin-top:15px;
  padding:12px;
  border:1px solid #1b8f2a;
  border-radius:8px;
  background:#f9f9f9;
}

.car-card img {
  width:60px;
  height:60px;
  border-radius:8px;
  object-fit:cover;
  border:2px solid #1b8f2a;
}

.connect-btn {
  background: var(--main-green);
  color:white;
  border:none;
  padding:8px 12px;
  border-radius:6px;
  cursor:pointer;
  font-size:14px;
  width:auto;
  white-space:nowrap;
}

.connect-btn:active { background:#166d20; }

/* ================= PAGINATION UI ================= */

.pagination {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;              /* reduced spacing */
  margin-top: 15px;
}

.page-btn {
  background: white;
  color: var(--main-green);
  border: 1.5px solid var(--main-green); /* slightly thinner */
  padding: 4px 6px;    /* smaller buttons */
  border-radius: 16px;  /* slightly tighter */
  cursor: pointer;
  font-size: 12px;      /* smaller text */
  transition: all 0.2s ease;
}

.page-btn:hover {
  background: var(--main-green);
  color: white;
}

.page-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.page-info {
  font-weight: 600;     /* less heavy than bold */
  font-size: 12px;      /* smaller text */
  color: var(--main-green);
  }



  /* ================= DRIVER CONTRACT REQUESTS ================= */

.contract-card {
  border: 1px solid var(--main-green);
  border-radius: 8px;
  padding: 12px;
  margin-top: 12px;
  background: #f0fff4;
}

  .contract-card img {
  display:block;
  }

.contract-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.contract-status {
  font-weight: bold;
  margin-top: 6px;
}

/* STATUS COLORS */
.status-pending {
  color: orange;
}

.status-accepted {
  color: green;
}

.status-rejected {
  color: red;
}

/* SMALL BUTTON (for cancel etc) */
.small-btn {
  margin-top: 8px;
  background: red;
  color: white;
  border: none;
  padding: 6px 10px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  width: auto;
}

.small-btn:active {
  background: #b30000;
}
  
</style>
</head>
<body>

<header>
  <div class="logo">
    <img src="assets/logo/d4d-logo.png" alt="D4D Logo">
  </div>
  <div class="menu-icon" id="menuToggle"><i class="fas fa-bars"></i></div>
  <nav id="navMenu">
    <a href="#">Home</a>
    <a href="#">Login</a>
    <a href="#">About</a>
  </nav>
</header>
<div class="container">

  <!-- REGISTRATION STATUS -->
  <div id="registrationStatus" class="status-box"></div>

  <h2>Driver Dashboard</h2>

  <!-- SEARCH (OPTIONAL TOOL) -->
  <label>Search by Number Plate</label>
  <input type="text" id="search_plate" placeholder="Enter number plate">
  <button onclick="searchDriver()">Search</button>

  <div id="result"></div>
  <div id="msg" class="msg"></div>

  <!-- REQUEST STATUS -->
  <hr style="margin:25px 0;">
  <h2>My Request Status</h2>
  <div id="requestStatus" class="status-box"></div>

  <!-- AVAILABLE CARS -->
  <hr style="margin:25px 0;">
  <h2>Available Cars</h2>
  <div id="availableCars" style="margin-top:20px;"></div>

</div>

<footer>
  &copy; 2025 Driver App. All rights reserved.
</footer>
  
<script>

/* ================= CONFIG ================= */

const BASE_URL = "https://drivers-backend-4spp.onrender.com";
const token = localStorage.getItem("token");

/* ================= AUTH CHECK ================= */

if (!token) {
  window.location.href = "login.html";
}

/* ================= GLOBALS ================= */

const statusBox = document.getElementById("registrationStatus");
const carsContainer = document.getElementById("availableCars");
const requestBox = document.getElementById("requestStatus");

let currentPage = 1;
const perPage = 4;
let totalPages = 1;
let requestState = null; // 🔥 track status globally

/* ================= REGISTRATION CHECK ================= */

async function checkRegistration() {
  try {
    const res = await fetch(`${BASE_URL}/check-driver-status`, {
      headers: {
        "Authorization": "Bearer " + token
      }
    });

    if (res.status === 401) {
      localStorage.removeItem("token");
      window.location.href = "login.html";
      return false;
    }

    const data = await res.json();

    if (data.fully_registered) {
      statusBox.className = "status-box status-complete";
      statusBox.innerHTML = "✔ Fully Registered";
      return true;
    } else {
      statusBox.className = "status-box status-incomplete";
      statusBox.innerHTML = `
        ⚠ Not Fully Registered<br>
        <a href="continue-form.html">Complete registration</a>
        <a href="partner-login.html" class="partner-login-link">
          Login as Partner
        </a>
      `;
      return false;
    }

  } catch {
    statusBox.className = "status-box status-incomplete";
    statusBox.innerHTML = `
      ⚠ Unable to verify registration<br>
      <a href="continue-form.html">Click to complete registration</a>
    `;
    return false;
  }
}

/* ================= REQUEST STATUS ================= */


  async function checkRequestStatus() {

  try {

    const res = await fetch(`${BASE_URL}/my-request-status`, {
      headers: {
        "Authorization": "Bearer " + token
      }
    });

    if (res.status === 401) {
      localStorage.removeItem("token");
      window.location.href = "login.html";
      return;
    }

    const data = await res.json();

    if (!data.success) {
      requestState = null;
      requestBox.innerHTML = "";
      return;
    }

    const connection = data.connection;

    // 🔥 THIS WAS THE MAIN BUG
    requestState = connection.status;

    let statusText = "⏳ Pending";
    let statusClass = "status-pending";

    if (connection.status === "approved") {
      statusText = "✔ Approved";
      statusClass = "status-accepted";
    }

    if (connection.status === "rejected") {
      statusText = "❌ Rejected";
      statusClass = "status-rejected";
    }

    requestBox.innerHTML = `
      <div class="contract-card">

        <div class="contract-header">
          <strong class="${statusClass}">
            ${statusText}
          </strong>
        </div>

        <div style="margin-top:10px;">
          <img 
            src="${connection.car_image_url || 'https://via.placeholder.com/100'}"
            style="
              width:100px;
              height:100px;
              object-fit:cover;
              border-radius:10px;
              border:2px solid #1b8f2a;
            "
          >
        </div>

        <div style="margin-top:10px;">
          <strong>Car:</strong>
          ${connection.car_make || ''} ${connection.car_model || ''}
        </div>

        <div style="margin-top:6px;">
          <strong>Number Plate:</strong>
          ${connection.number_plate || 'N/A'}
        </div>

        <div style="margin-top:6px;">
          <strong>Owner:</strong>
          ${connection.owner_full_name || 'N/A'}
        </div>

        <div style="margin-top:6px;">
          <strong>Phone:</strong>
          ${connection.owner_phone_number || 'N/A'}
        </div>

      </div>
    `;

  } catch (err) {

    console.log(err);

    requestBox.innerHTML = `
      <div class="status-box status-incomplete">
        Failed to load request status
      </div>
    `;
  }
  }

/* ================= SEARCH DRIVER ================= */

async function searchDriver(){
  const plate = document.getElementById("search_plate").value.trim();
  const msg = document.getElementById("msg");
  const result = document.getElementById("result");

  result.innerHTML = "";
  msg.textContent = "";

  if(!plate){
    msg.textContent = "Please enter a number plate.";
    return;
  }

  try{
    const res = await fetch(
      `${BASE_URL}/search-driver?number_plate=${encodeURIComponent(plate)}`
    );

    const data = await res.json();

    if(!data.success){
      msg.textContent = data.error || "Driver not found.";
      return;
    }

    const driver = data.driver;

    result.innerHTML = `
      <div class="driver-card">
        <img src="${driver.profile_pic_url || 'https://via.placeholder.com/60'}">
        <div>
          <strong>${driver.full_name}</strong><br>
          ${driver.number_plate}
        </div>
      </div>
    `;

  } catch {
    msg.textContent = "Network error.";
  }
}

/* ================= MENU ================= */

const menuToggle = document.getElementById('menuToggle');
const navMenu = document.getElementById('navMenu');

menuToggle.addEventListener('click', () => {
  navMenu.classList.toggle('active');
  menuToggle.innerHTML = navMenu.classList.contains('active')
    ? '<i class="fas fa-times"></i>'
    : '<i class="fas fa-bars"></i>';
});

/* ================= LOAD CARS ================= */

async function loadAvailableCars(page = 1) {
  carsContainer.innerHTML = "<p>Loading...</p>";

  try {
    const res = await fetch(`${BASE_URL}/available-cars?page=${page}&limit=${perPage}`);
    const data = await res.json();

    if (!data.success || !data.cars.length) {
      carsContainer.innerHTML = "<p>No available cars.</p>";
      return;
    }

    currentPage = data.pagination.page;
    totalPages = data.pagination.total_pages;

    renderPage(data.cars);

  } catch {
    carsContainer.innerHTML = "<p>Failed to load cars.</p>";
  }
}

/* ================= RENDER PAGE ================= */

function renderPage(cars) {
  carsContainer.innerHTML = "";

  cars.forEach(car => {
    const card = createCarCard(car);
    carsContainer.appendChild(card);
  });

  renderPagination();
}

/* ================= CAR CARD ================= */

function createCarCard(car) {

  const card = document.createElement("div");
  card.className = "car-card";

  // 🔥 determine button state based on request
  let btnText = "Send Request";
  let disabled = false;

  if (requestState === "pending") {
    btnText = "Pending";
    disabled = true;
  }

  if (requestState === "approved") {
    btnText = "Approved";
    disabled = true;
  }

  card.innerHTML = `
    <img src="${car.car_image_url || 'https://via.placeholder.com/60'}">
    <div style="flex:1">
      <strong>${car.car_make} ${car.car_model}</strong><br>
      ${car.number_plate}
    </div>
    <button class="connect-btn" ${disabled ? "disabled" : ""}>${btnText}</button>
  `;

  const btn = card.querySelector(".connect-btn");

  if (disabled) return card;

  btn.onclick = async () => {

    if (!confirm(`Send request for ${car.number_plate}?`)) return;

    const location = prompt("Enter your residential area:");

    if (!location || !location.trim()) {
      alert("Location required");
      return;
    }

    btn.disabled = true;
    btn.textContent = "Sending...";

    try {
      const res = await fetch(`${BASE_URL}/send-request`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + token
        },
        body: JSON.stringify({
          number_plate: car.number_plate,
          location: location.trim()
        })
      });

      const data = await res.json();

      if (res.ok) {
        btn.textContent = "Request Sent";
        requestState = "pending";
        checkRequestStatus(); // refresh UI
      } else {
        alert(data.error || "Failed");
        btn.disabled = false;
        btn.textContent = "Send Request";
      }

    } catch {
      alert("Network error");
      btn.disabled = false;
      btn.textContent = "Send Request";
    }
  };

  return card;
}

/* ================= PAGINATION ================= */

function renderPagination() {

  const nav = document.createElement("div");
  nav.className = "pagination";

  nav.innerHTML = `
    <button class="page-btn" ${currentPage === 1 ? "disabled" : ""}>
      <i class="fas fa-chevron-left"></i>
    </button>

    <span class="page-info">
      Page ${currentPage} of ${totalPages}
    </span>

    <button class="page-btn" ${currentPage === totalPages ? "disabled" : ""}>
      <i class="fas fa-chevron-right"></i>
    </button>
  `;

  const buttons = nav.querySelectorAll("button");

  buttons[0].onclick = () => {
    if (currentPage > 1) {
      loadAvailableCars(currentPage - 1);
    }
  };

  buttons[1].onclick = () => {
    if (currentPage < totalPages) {
      loadAvailableCars(currentPage + 1);
    }
  };

  carsContainer.appendChild(nav);
}

/* ================= APP START ================= */

window.addEventListener("DOMContentLoaded", async () => {

  // registration check
  await checkRegistration();

  // ALWAYS run these
  await checkRequestStatus();

  await loadAvailableCars(1);

});

</script>


</body>
   </html>
