<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Driver Dashboard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root {
  --main-green: #1b8f2a;
  --white: #ffffff;
}

body { font-family: Arial, sans-serif; margin:0; padding:20px; background:#f5f5f5; }

.container {
  max-width:600px;
  margin:auto;
  background:white;
  padding:22px;
  border-radius:10px;
  box-shadow:0 3px 10px rgba(0,0,0,0.12);
}

h2 { color:#1b8f2a; text-align:center; margin-bottom:20px; }

input {
  width:100%;
  padding:12px;
  border:2px solid #1b8f2a;
  border-radius:8px;
  font-size:16px;
  margin-bottom:20px;
}

button {
  width:100%;
  background:#1b8f2a;
  color:white;
  padding:14px;
  border:none;
  border-radius:8px;
  font-size:18px;
  cursor:pointer;
}

button:active { background:#166d20; }

.driver-card {
  display:flex;
  align-items:center;
  gap:15px;
  margin-top:20px;
  padding:12px;
  border:1px solid #1b8f2a;
  border-radius:8px;
}

.driver-card img {
  width:60px;
  height:60px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #1b8f2a;
}

.msg { margin-top:10px; font-weight:bold; color:red; }

/* STATUS BOX */
.status-box{
  text-align:center;
  padding:12px;
  border-radius:8px;
  font-weight:bold;
  margin-bottom:15px;
}

.status-complete{
  background:#e6f7ea;
  color:var(--main-green);
  border:1px solid var(--main-green);
}

.status-incomplete{
  background:#ffe6e6;
  color:red;
  border:1px solid red;
}

.status-incomplete a{
  color:red;
  text-decoration:none;
  font-weight:bold;
}

/* HEADER */
header {
  background-color: var(--main-green);
  color: var(--white);
  padding: 15px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: relative;
}

header .logo img {
  height: 32px;
}

header .menu-icon {
  font-size: 24px;
  cursor: pointer;
  display: none;
}

nav {
  display: flex;
  gap: 20px;
}

nav a {
  color: var(--white);
  text-decoration: none;
}

nav.active {
  display: block;
  position: absolute;
  top: 60px;
  right: 20px;
  background-color: var(--main-green);
  padding: 15px;
  border-radius: 5px;
  width: 150px;
}

nav.active a {
  display: block;
  margin: 10px 0;
}

@media screen and (max-width: 768px) {
  nav { display:none; flex-direction:column; }
  header .menu-icon { display:block; }
}

/* FOOTER */
footer {
  background-color: var(--main-green);
  color: var(--white);
  text-align: center;
  padding: 15px;
  margin-top: auto;
}

.car-card {
  display:flex;
  align-items:center;
  gap:15px;
  margin-top:15px;
  padding:12px;
  border:1px solid #1b8f2a;
  border-radius:8px;
  background:#f9f9f9;
}

.car-card img {
  width:60px;
  height:60px;
  border-radius:8px;
  object-fit:cover;
  border:2px solid #1b8f2a;
}

.connect-btn {
  background: var(--main-green);
  color:white;
  border:none;
  padding:8px 12px;
  border-radius:6px;
  cursor:pointer;
  font-size:14px;
  width:auto;
  white-space:nowrap;
}

.connect-btn:active { background:#166d20; }

</style>
</head>
<body>

<header>
  <div class="logo">
    <img src="assets/logo/d4d-logo.png" alt="D4D Logo">
  </div>
  <div class="menu-icon" id="menuToggle"><i class="fas fa-bars"></i></div>
  <nav id="navMenu">
    <a href="#">Home</a>
    <a href="#">Login</a>
    <a href="#">About</a>
  </nav>
</header>

<div class="container">

  <!-- REGISTRATION STATUS -->
  <div id="registrationStatus" class="status-box"></div>

  <h2>Driver Dashboard</h2>

  <label>Search by Number Plate</label>
  <input type="text" id="search_plate" placeholder="Enter number plate">
  <button onclick="searchDriver()">Search</button>

  <div id="result"></div>
  <div id="msg" class="msg"></div>

  <h2>Available Cars</h2>
  <div id="availableCars" style="margin-top:20px;"></div>

</div>

<footer>
  &copy; 2025 Driver App. All rights reserved.
</footer>

<script>

/* ================= AUTH CHECK ================= */

const token = localStorage.getItem("token");

if (!token) {
  window.location.href = "login.html";
}

/* ================= REGISTRATION CHECK ================= */

const statusBox = document.getElementById("registrationStatus");

async function checkRegistration() {
  try {
    const res = await fetch(
      "https://drivers-backend-4spp.onrender.com/check-driver-status",
      {
        headers: {
          "Authorization": "Bearer " + token
        }
      }
    );

    if (res.status === 401) {
      localStorage.removeItem("token");
      window.location.href = "login.html";
      return false;
    }

    const data = await res.json();

    if (data.fully_registered) {
      statusBox.className = "status-box status-complete";
      statusBox.innerHTML = "✔ Fully Registered";
      return true;
    } else {
      statusBox.className = "status-box status-incomplete";
      statusBox.innerHTML =
        '⚠ Not Fully Registered - <a href="continue-driver-form.html">Click here to complete registration</a>';
      return false;
    }

  } catch {
    statusBox.className = "status-box status-incomplete";
    statusBox.innerHTML =
      '⚠ Unable to verify registration - <a href="continue-driver-form.html">Click to complete registration</a>';
    return false;
  }
}

/* ================= SEARCH DRIVER ================= */

async function searchDriver(){
  const plate = document.getElementById("search_plate").value.trim();
  const msg = document.getElementById("msg");
  const result = document.getElementById("result");
  result.innerHTML = "";
  msg.textContent = "";

  if(!plate){
    msg.textContent = "Please enter a number plate.";
    return;
  }

  try{
    const res = await fetch(`https://drivers-backend-4spp.onrender.com/search-driver?number_plate=${encodeURIComponent(plate)}`);
    const data = await res.json();

    if(!data.success){
      msg.textContent = data.error || "Driver not found.";
      return;
    }

    const driver = data.driver;
    result.innerHTML = `
      <div class="driver-card">
        <img src="${driver.profile_pic_url || 'https://via.placeholder.com/60'}" alt="Profile">
        <div>
          <strong>${driver.full_name}</strong><br>
          ${driver.number_plate}
        </div>
      </div>
    `;

  }catch{
    msg.textContent = "Network error. Try again.";
  }
}

/* ================= MENU ================= */

const menuToggle = document.getElementById('menuToggle');
const navMenu = document.getElementById('navMenu');

menuToggle.addEventListener('click', () => {
  navMenu.classList.toggle('active');
  menuToggle.innerHTML = navMenu.classList.contains('active')
    ? '<i class="fas fa-times"></i>'
    : '<i class="fas fa-bars"></i>';
});

/* ================= LOAD CARS ================= */

async function loadAvailableCars() {
  const container = document.getElementById("availableCars");
  container.innerHTML = "";

  try {
    const res = await fetch("https://drivers-backend-4spp.onrender.com/available-cars");
    const data = await res.json();

    if(!data.success || !data.cars.length){
      container.innerHTML = "<p>No available cars found.</p>";
      return;
    }

    data.cars.forEach(car => {
      const card = document.createElement("div");
      card.className = "car-card";
      card.innerHTML = `
        <img src="${car.car_image_url || 'https://via.placeholder.com/60'}">
        <div style="flex:1">
          <strong>${car.car_make} ${car.car_model}</strong><br>
          ${car.number_plate}
        </div>
        <button class="connect-btn"
          onclick="connectOwner('${car.number_plate}')">
          Connect
        </button>
      `;
      container.appendChild(card);
    });

  } catch {
    container.innerHTML = "<p>Failed to load available cars.</p>";
  }
}

/* ================= CONNECT OWNER ================= */

function connectOwner(numberPlate) {
  const confirmConnect = confirm(`Do you want to connect with the owner of ${numberPlate}?`);
  if (!confirmConnect) return;

  const location = prompt("Enter your residential area (e.g. Donholm, Umoja):");

  if (!location || !location.trim()) {
    alert("Location is required.");
    return;
  }

  alert(`Request sent for ${numberPlate}\nLocation: ${location.trim()}`);
}

/* ================= APP START ================= */

window.addEventListener("DOMContentLoaded", async () => {
  const registered = await checkRegistration();

  if (registered) {
    loadAvailableCars();
  } else {
    document.getElementById("availableCars").innerHTML =
      "<p style='color:red;text-align:center'>Complete registration to continue.</p>";
  }
});

</script>

</body>
   </html>
