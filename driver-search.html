<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Driver Dashboard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root {
  --main-green: #1b8f2a;
  --white: #ffffff;
}

body { font-family: Arial, sans-serif; margin:0; padding:20px; background:#f5f5f5; }

.container {
  max-width:600px;
  margin:auto;
  background:white;
  padding:22px;
  border-radius:10px;
  box-shadow:0 3px 10px rgba(0,0,0,0.12);
}

h2 { color:#1b8f2a; text-align:center; margin-bottom:20px; }

input {
  width:100%;
  padding:12px;
  border:2px solid #1b8f2a;
  border-radius:8px;
  font-size:16px;
  margin-bottom:20px;
}

button {
  width:100%;
  background:#1b8f2a;
  color:white;
  padding:14px;
  border:none;
  border-radius:8px;
  font-size:18px;
  cursor:pointer;
}

/* Buttons inside cards should NOT stretch full width */
.connect-btn,
.small-btn {
  width: auto;
  font-size: 14px;
  padding: 8px 12px;
}

button:active { background:#166d20; }

.driver-card {
  display:flex;
  align-items:center;
  gap:15px;
  margin-top:20px;
  padding:12px;
  border:1px solid #1b8f2a;
  border-radius:8px;
}

.driver-card img {
  width:60px;
  height:60px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #1b8f2a;
}

.msg { margin-top:10px; font-weight:bold; color:red; }

/* STATUS BOX */
.status-box{
  text-align:center;
  padding:12px;
  border-radius:8px;
  font-weight:bold;
  margin-bottom:15px;
}

.status-complete{
  background:#e6f7ea;
  color:var(--main-green);
  border:1px solid var(--main-green);
}

.status-incomplete{
  background:#ffe6e6;
  color:red;
  border:1px solid red;
}

.status-incomplete a{
  color:red;
  text-decoration:none;
  font-weight:bold;
}

.partner-login-link {
  display: block;
  margin-top: 10px;
  color: var(--main-green) !important;
  text-decoration: none;
  font-weight: bold;
  font-size: 14px;
}

.partner-login-link:hover {
  text-decoration: underline;
  }
               
/* HEADER */
header {
  background-color: var(--main-green);
  color: var(--white);
  padding: 15px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: relative;
}

header .logo img {
  height: 32px;
}

header .menu-icon {
  font-size: 24px;
  cursor: pointer;
  display: none;
}

nav {
  display: flex;
  gap: 20px;
}

nav a {
  color: var(--white);
  text-decoration: none;
}

nav.active {
  display: block;
  position: absolute;
  top: 60px;
  right: 20px;
  background-color: var(--main-green);
  padding: 15px;
  border-radius: 5px;
  width: 150px;
}

nav.active a {
  display: block;
  margin: 10px 0;
}

@media screen and (max-width: 768px) {
  nav { display:none; flex-direction:column; }
  header .menu-icon { display:block; }
}

/* FOOTER */
footer {
  background-color: var(--main-green);
  color: var(--white);
  text-align: center;
  padding: 15px;
  margin-top: auto;
}

.car-card {
  display:flex;
  align-items:center;
  gap:15px;
  margin-top:15px;
  padding:12px;
  border:1px solid #1b8f2a;
  border-radius:8px;
  background:#f9f9f9;
}

.car-card img {
  width:60px;
  height:60px;
  border-radius:8px;
  object-fit:cover;
  border:2px solid #1b8f2a;
}

.connect-btn {
  background: var(--main-green);
  color:white;
  border:none;
  padding:8px 12px;
  border-radius:6px;
  cursor:pointer;
  font-size:14px;
  width:auto;
  white-space:nowrap;
}

.connect-btn:active { background:#166d20; }

/* ================= PAGINATION UI ================= */

.pagination {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;              /* reduced spacing */
  margin-top: 15px;
}

.page-btn {
  background: white;
  color: var(--main-green);
  border: 1.5px solid var(--main-green); /* slightly thinner */
  padding: 4px 6px;    /* smaller buttons */
  border-radius: 16px;  /* slightly tighter */
  cursor: pointer;
  font-size: 12px;      /* smaller text */
  transition: all 0.2s ease;
}

.page-btn:hover {
  background: var(--main-green);
  color: white;
}

.page-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.page-info {
  font-weight: 600;     /* less heavy than bold */
  font-size: 12px;      /* smaller text */
  color: var(--main-green);
  }



  /* ================= DRIVER CONTRACT REQUESTS ================= */

.contract-card {
  border: 1px solid var(--main-green);
  border-radius: 8px;
  padding: 12px;
  margin-top: 12px;
  background: #f0fff4;
}

  .contract-card img {
  display:block;
  }

.contract-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.contract-status {
  font-weight: bold;
  margin-top: 6px;
}

/* STATUS COLORS */
.status-pending {
  color: orange;
}

.status-accepted {
  color: green;
}

.status-rejected {
  color: red;
}

/* SMALL BUTTON (for cancel etc) */
.small-btn {
  margin-top: 8px;
  background: red;
  color: white;
  border: none;
  padding: 6px 10px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  width: auto;
}

.small-btn:active {
  background: #b30000;
}



/* ================= REMITTANCE ================= */

.remittance-panel{
  margin-top:15px;
  padding:12px;
  border:1px solid #ddd;
  border-radius:8px;
  background:#fafafa;
}

.week-title{
  font-weight:bold;
  color:#1b8f2a;
  margin-bottom:10px;
}

.remittance-legend{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

.legend-item{
  display:flex;
  align-items:center;
  gap:5px;
  font-size:14px;
}

.legend-color{
  width:15px;
  height:15px;
  border-radius:4px;
}

.day-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.day-btn{
  border:none;
  padding:12px;
  border-radius:8px;
  font-weight:bold;
  color:white;
  cursor:default;
}

.day-grey{
  background:grey;
}

.day-green{
  background:green;
}

.day-red{
  background:red;
}

.day-orange{
  background:orange;
  color:white;
}

.balance-box{
  margin-top:15px;
  padding:10px;
  background:#fff3cd;
  border-radius:8px;
  font-weight:bold;
}
  
</style>
</head>
<body>

<header>
  <div class="logo">
    <img src="assets/logo/d4d-logo.png" alt="D4D Logo">
  </div>
  <div class="menu-icon" id="menuToggle"><i class="fas fa-bars"></i></div>
  <nav id="navMenu">
    <a href="#">Home</a>
    <a href="#">Login</a>
    <a href="#">About</a>
  </nav>
</header>
<div class="container">

  <!-- REGISTRATION STATUS -->
  <div id="registrationStatus" class="status-box"></div>

  <h2>Driver Dashboard</h2>

  <!-- SEARCH (OPTIONAL TOOL) -->
  <label>Search by Number Plate</label>
  <input type="text" id="search_plate" placeholder="Enter number plate">
  <button onclick="searchDriver()">Search</button>

  <div id="result"></div>
  <div id="msg" class="msg"></div>

  <!-- REQUEST STATUS -->
  <hr style="margin:25px 0;">
  <h2>My Request Status</h2>
  <div id="requestStatus" class="status-box"></div>

  <!-- AVAILABLE CARS -->
  <hr style="margin:25px 0;">
  <h2>Available Cars</h2>
  <div id="availableCars" style="margin-top:20px;"></div>

</div>

<footer>
  &copy; 2025 Driver App. All rights reserved.
</footer>
  
<script>

/* ================= CONFIG ================= */

const BASE_URL = "https://drivers-backend-4spp.onrender.com";
const token = localStorage.getItem("token");

/* ================= AUTH CHECK ================= */

if (!token) {
  window.location.href = "login.html";
}

/* ================= GLOBALS ================= */

const statusBox = document.getElementById("registrationStatus");
const carsContainer = document.getElementById("availableCars");
const requestBox = document.getElementById("requestStatus");

let currentPage = 1;
const perPage = 4;
let totalPages = 1;
let requestState = null; // 🔥 track status globally

/* ================= REGISTRATION CHECK ================= */

async function checkRegistration() {
  try {
    const res = await fetch(`${BASE_URL}/check-driver-status`, {
      headers: {
        "Authorization": "Bearer " + token
      }
    });

    if (res.status === 401) {
      localStorage.removeItem("token");
      window.location.href = "login.html";
      return false;
    }

    const data = await res.json();

    if (data.fully_registered) {
      statusBox.className = "status-box status-complete";
      statusBox.innerHTML = "✔ Fully Registered";
      return true;
    } else {
      statusBox.className = "status-box status-incomplete";
      statusBox.innerHTML = `
        ⚠ Not Fully Registered<br>
        <a href="continue-form.html">Complete registration</a>
        <a href="partner-login.html" class="partner-login-link">
          Login as Partner
        </a>
      `;
      return false;
    }

  } catch {
    statusBox.className = "status-box status-incomplete";
    statusBox.innerHTML = `
      ⚠ Unable to verify registration<br>
      <a href="continue-form.html">Click to complete registration</a>
    `;
    return false;
  }
}

/* ================= REQUEST STATUS ================= */
async function checkRequestStatus() {

  requestBox.innerHTML = `
    <div class="status-box">
      Loading request status...
    </div>
  `;

  try {

    const res = await fetch(`${BASE_URL}/my-request-status`, {
      headers: {
        "Authorization": "Bearer " + token
      }
    });

    console.log("STATUS RESPONSE:", res);

    if (res.status === 401) {
      localStorage.removeItem("token");
      window.location.href = "login.html";
      return;
    }

    if (!res.ok) {
      throw new Error("Server returned " + res.status);
    }

    const data = await res.json();

    console.log("STATUS DATA:", data);

    if (!data.success) {

      requestState = null;

      requestBox.innerHTML = `
        <div class="status-box status-incomplete">
          No active request found
        </div>
      `;

      return;
    }

    if (!data.connection) {
      throw new Error("Connection object missing");
    }

    const connection = data.connection;

    requestState = connection.status;

    let statusText = "⏳ Pending";
    let statusClass = "status-pending";

    if (connection.status === "approved") {
      statusText = "✔ Approved";
      statusClass = "status-accepted";
    }

    if (connection.status === "rejected") {
      statusText = "❌ Rejected";
      statusClass = "status-rejected";
    }

    requestBox.innerHTML = `
      <div class="contract-card">

        <div class="contract-header">
          <strong class="${statusClass}">
            ${statusText}
          </strong>
        </div>

        <div style="margin-top:10px;">
          <img 
            src="${connection.car_image_url || 'https://via.placeholder.com/100'}"
            style="
              width:100px;
              height:100px;
              object-fit:cover;
              border-radius:10px;
              border:2px solid #1b8f2a;
            "
          >
        </div>

        <div style="margin-top:10px;">
          <strong>Car:</strong>
          ${connection.car_make || ''} ${connection.car_model || ''}
        </div>

        <div style="margin-top:6px;">
          <strong>Owner:</strong>
          ${connection.owner_full_name || 'N/A'}
        </div>

        <div style="margin-top:6px;">
          <strong>Phone:</strong>
          ${connection.owner_phone_number || 'N/A'}
        </div>

        ${
          connection.contract_status === "active"
          ? `
            <button 
              class="connect-btn"
              id="seeContractBtn"
              style="margin-top:12px;"
            >
              See Contract
            </button>
          `
          : ""
        }

      </div>

      <!-- CONTRACT OVERLAY -->

      <div id="contractOverlay" style="
        display:none;
        position:fixed;
        top:0;
        left:0;
        width:100%;
        height:100%;
        background:rgba(0,0,0,0.6);
        z-index:999;
        justify-content:center;
        align-items:center;
      ">

        <div style="
          background:white;
          width:90%;
          max-width:400px;
          padding:20px;
          border-radius:12px;
        ">

          <h3 style="
            color:#1b8f2a;
            text-align:center;
            margin-bottom:20px;
          ">
            Contract Details
          </h3>

          <p>
            <strong>Daily Amount:</strong>
            KES ${connection.contract_amount || 0}
          </p>

          <p>
            <strong>Work Days:</strong>
            ${connection.work_days || 0} days/week
          </p>

          <p>
            <strong>Status:</strong>
            ${connection.contract_status || "inactive"}
          </p>
          <div id="driverRemittanceContainer"></div>

          <button
            class="small-btn"
            id="cancelContractBtn"
          >
            Cancel Contract
          </button>

          <button
            class="connect-btn"
            id="closeOverlayBtn"
            style="margin-left:10px;"
          >
            Close
          </button>

        </div>

      </div>
    `;

    /* ================= OVERLAY EVENTS ================= */

    const overlay = document.getElementById("contractOverlay");

    const seeBtn = document.getElementById("seeContractBtn");

    if (seeBtn) {

      seeBtn.onclick = () => {

  overlay.style.display = "flex";

  const remittanceContainer =
    document.getElementById(
      "driverRemittanceContainer"
    );

  renderRemittancePanel(
    remittanceContainer,
    connection
  );
};
    }

    const closeBtn = document.getElementById("closeOverlayBtn");

    if (closeBtn) {

      closeBtn.onclick = () => {
        overlay.style.display = "none";
      };

    }

    const cancelBtn = document.getElementById("cancelContractBtn");

    if (cancelBtn) {

      cancelBtn.onclick = async () => {

        const confirmed = confirm(
          "Are you sure you want to cancel this contract?"
        );

        if (!confirmed) return;

        try {

          const res = await fetch(
            `${BASE_URL}/cancel-contract`,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + token
              },
              body: JSON.stringify({
                connection_id: connection.id
              })
            }
          );

          const result = await res.json();

          if (res.ok) {

            alert("Contract cancelled");

            overlay.style.display = "none";

            checkRequestStatus();

          } else {

            alert(result.error || "Failed");

          }

        } catch {

          alert("Network error");

        }

      };

    }

  } catch (err) {

    console.error("REQUEST STATUS ERROR:", err);

    requestBox.innerHTML = `
      <div class="status-box status-incomplete">
        ${err.message}
      </div>
    `;
  }
  }

/* ================= SEARCH DRIVER ================= */

async function searchDriver(){
  const plate = document.getElementById("search_plate").value.trim();
  const msg = document.getElementById("msg");
  const result = document.getElementById("result");

  result.innerHTML = "";
  msg.textContent = "";

  if(!plate){
    msg.textContent = "Please enter a number plate.";
    return;
  }

  try{
    const res = await fetch(
      `${BASE_URL}/search-driver?number_plate=${encodeURIComponent(plate)}`
    );

    const data = await res.json();

    if(!data.success){
      msg.textContent = data.error || "Driver not found.";
      return;
    }

    const driver = data.driver;

    result.innerHTML = `
      <div class="driver-card">
        <img src="${driver.profile_pic_url || 'https://via.placeholder.com/60'}">
        <div>
          <strong>${driver.full_name}</strong><br>
          ${driver.number_plate}
        </div>
      </div>
    `;

  } catch {
    msg.textContent = "Network error.";
  }
}

/* ================= MENU ================= */

const menuToggle = document.getElementById('menuToggle');
const navMenu = document.getElementById('navMenu');

menuToggle.addEventListener('click', () => {
  navMenu.classList.toggle('active');
  menuToggle.innerHTML = navMenu.classList.contains('active')
    ? '<i class="fas fa-times"></i>'
    : '<i class="fas fa-bars"></i>';
});

/* ================= LOAD CARS ================= */

async function loadAvailableCars(page = 1) {
  carsContainer.innerHTML = "<p>Loading...</p>";

  try {
    const res = await fetch(`${BASE_URL}/available-cars?page=${page}&limit=${perPage}`);
    const data = await res.json();

    if (!data.success || !data.cars.length) {
      carsContainer.innerHTML = "<p>No available cars.</p>";
      return;
    }

    currentPage = data.pagination.page;
    totalPages = data.pagination.total_pages;

    renderPage(data.cars);

  } catch {
    carsContainer.innerHTML = "<p>Failed to load cars.</p>";
  }
}

/* ================= RENDER PAGE ================= */

function renderPage(cars) {
  carsContainer.innerHTML = "";

  cars.forEach(car => {
    const card = createCarCard(car);
    carsContainer.appendChild(card);
  });

  renderPagination();
}

/* ================= CAR CARD ================= */
function createCarCard(car) {

  const card = document.createElement("div");
  card.className = "car-card";

  // 🔥 determine button state based on request
  let btnText = "Send Request";
  let disabled = false;

  if (requestState === "pending") {
    btnText = "Pending";
    disabled = true;
  }

  if (requestState === "approved") {
    btnText = "Approved";
    disabled = true;
  }

  card.innerHTML = `
    <img src="${car.car_image_url || 'https://via.placeholder.com/60'}">
    <div style="flex:1">
      <strong>${car.car_make} ${car.car_model}</strong><br>
      ${car.number_plate}
    </div>
    <button class="connect-btn" ${disabled ? "disabled" : ""}>${btnText}</button>
  `;

  const btn = card.querySelector(".connect-btn");

  if (disabled) return card;

  btn.onclick = async () => {

    if (!confirm(`Send request for ${car.number_plate}?`)) return;

    const location = prompt("Enter your residential area:");

    if (!location || !location.trim()) {
      alert("Location required");
      return;
    }

    btn.disabled = true;
    btn.textContent = "Sending...";

    try {

      alert(
        "SENDING REQUEST:\n\n" +
        "Plate: " + car.number_plate + "\n" +
        "Location: " + location.trim()
      );

      const res = await fetch(`${BASE_URL}/send-request`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + token
        },
        body: JSON.stringify({
          number_plate: car.number_plate,
          location: location.trim()
        })
      });

      const data = await res.json();

      alert(
        "SEND REQUEST RESPONSE:\n\n" +
        "Status Code: " + res.status + "\n" +
        "Response: " + JSON.stringify(data)
      );

      if (res.ok) {

        btn.textContent = "Request Sent";

        requestState = "pending";

        checkRequestStatus(); // refresh UI

      } else {

        alert(data.error || "Failed");

        btn.disabled = false;
        btn.textContent = "Send Request";
      }

    } catch (err) {

      alert(
        "SEND REQUEST ERROR:\n\n" +
        "Message: " + err.message
      );

      btn.disabled = false;
      btn.textContent = "Send Request";
    }
  };

  return card;
  }


/* ================= PAGINATION ================= */

function renderPagination() {

  const nav = document.createElement("div");
  nav.className = "pagination";

  nav.innerHTML = `
    <button class="page-btn" ${currentPage === 1 ? "disabled" : ""}>
      <i class="fas fa-chevron-left"></i>
    </button>

    <span class="page-info">
      Page ${currentPage} of ${totalPages}
    </span>

    <button class="page-btn" ${currentPage === totalPages ? "disabled" : ""}>
      <i class="fas fa-chevron-right"></i>
    </button>
  `;

  const buttons = nav.querySelectorAll("button");

  buttons[0].onclick = () => {
    if (currentPage > 1) {
      loadAvailableCars(currentPage - 1);
    }
  };

  buttons[1].onclick = () => {
    if (currentPage < totalPages) {
      loadAvailableCars(currentPage + 1);
    }
  };

  carsContainer.appendChild(nav);
}

/* ================= APP START ================= */

window.addEventListener("DOMContentLoaded", async () => {

  // registration check
  await checkRegistration();

  // ALWAYS run these
  await checkRequestStatus();

  await loadAvailableCars(1);

});



/* ================= DRIVER REMITTANCE PANEL ================= */

function renderRemittancePanel(container, contract) {

  container.innerHTML = `
    <div class="remittance-panel">

      <div style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        margin-bottom:10px;
      ">

        <button
          id="prevWeekBtn"
          class="connect-btn"
          style="padding:6px 10px;">
          <i class="fas fa-chevron-left"></i>
        </button>

        <div
          id="weekTitle"
          class="week-title"
          style="margin:0;">
          Loading...
        </div>

        <button
          id="nextWeekBtn"
          class="connect-btn"
          style="padding:6px 10px;">
          <i class="fas fa-chevron-right"></i>
        </button>

      </div>

      <div class="remittance-legend">

        <div class="legend-item">
          <div class="legend-color day-grey"></div>
          Pending
        </div>

        <div class="legend-item">
          <div class="legend-color day-green"></div>
          Paid
        </div>

        <div class="legend-item">
          <div class="legend-color day-red"></div>
          Unpaid
        </div>

        <div class="legend-item">
          <div class="legend-color day-orange"></div>
          Partial
        </div>

      </div>

      <div
        class="day-grid"
        id="driver-days-${contract.id}">
      </div>

      <div
        class="balance-box"
        id="driver-balance-${contract.id}">
        Loading balance...
      </div>

    </div>
  `;

  const daysContainer =
    document.getElementById(
      `driver-days-${contract.id}`
    );

  const prevBtn =
    document.getElementById("prevWeekBtn");

  const nextBtn =
    document.getElementById("nextWeekBtn");

  const weekTitle =
    document.getElementById("weekTitle");


  /* =====================================================
     LOAD REMITTANCE DATA
  ===================================================== */

  loadRemittanceData();


  async function loadRemittanceData() {

    try {

      const res = await fetch(
        `${BASE_URL}/payment-installments/${contract.id}`,
        {
          method: "GET",
          headers: {
            "Authorization": "Bearer " + token
          }
        }
      );


      /* ================= CHECK HTTP RESPONSE ================= */

      if (!res.ok) {

        const errorText =
          await res.text();

        console.error(
          "REMITTANCE SERVER ERROR:",
          res.status,
          errorText
        );

        throw new Error(
          "Server returned " + res.status
        );
      }


      /* ================= READ JSON ================= */

      const rows =
        await res.json();


      console.log(
        "REMITTANCE DATA:",
        rows
      );


      /* =====================================================
         CHECK DATA
      ===================================================== */

      if (
        !Array.isArray(rows) ||
        rows.length === 0
      ) {

        daysContainer.innerHTML = `
          <div style="
            grid-column:1/-1;
            text-align:center;
            color:grey;
            padding:15px;
          ">
            No remittance schedule available.
          </div>
        `;

        weekTitle.textContent =
          "No Schedule";

        prevBtn.disabled = true;
        nextBtn.disabled = true;

        fetchCurrentBalance();

        return;
      }


      /* =====================================================
         SORT BY DATE
      ===================================================== */

      rows.sort((a, b) => {

        return (
          new Date(a.remittance_date) -
          new Date(b.remittance_date)
        );

      });


      /* =====================================================
         GET UNIQUE WEEKS
      ===================================================== */

      const weeks = [
        ...new Set(
          rows
            .map(row =>
              Number(row.week_number)
            )
            .filter(
              week => !isNaN(week)
            )
        )
      ].sort(
        (a, b) => a - b
      );


      /* =====================================================
         SAFETY CHECK
      ===================================================== */

      if (!weeks.length) {

        console.error(
          "REMITTANCE ROWS HAVE NO VALID WEEK NUMBERS:",
          rows
        );

        daysContainer.innerHTML = `
          <div style="
            grid-column:1/-1;
            text-align:center;
            color:red;
            padding:15px;
          ">
            Remittance data has no valid week number.
          </div>
        `;

        weekTitle.textContent =
          "Invalid Schedule";

        prevBtn.disabled = true;
        nextBtn.disabled = true;

        fetchCurrentBalance();

        return;
      }


      /* =====================================================
         START AT LATEST WEEK
      ===================================================== */

      let currentWeekIndex =
        weeks.length - 1;


      /* =====================================================
         RENDER CURRENT WEEK
      ===================================================== */

      renderWeek();


      /* =====================================================
         PREVIOUS WEEK
      ===================================================== */

      prevBtn.onclick = () => {

        if (
          currentWeekIndex > 0
        ) {

          currentWeekIndex--;

          renderWeek();

        }

      };


      /* =====================================================
         NEXT WEEK
      ===================================================== */

      nextBtn.onclick = () => {

        if (
          currentWeekIndex <
          weeks.length - 1
        ) {

          currentWeekIndex++;

          renderWeek();

        }

      };


      /* =====================================================
         RENDER WEEK FUNCTION
      ===================================================== */

      function renderWeek() {

        const week =
          weeks[currentWeekIndex];


        weekTitle.innerHTML =
          `Week ${week}`;


        daysContainer.innerHTML =
          "";


        const weekRows =
          rows.filter(row => {

            return (
              Number(row.week_number) ===
              Number(week)
            );

          });


        /* ================= NO ROWS ================= */

        if (!weekRows.length) {

          daysContainer.innerHTML = `
            <div style="
              grid-column:1/-1;
              text-align:center;
              color:grey;
              padding:15px;
            ">
              No records for this week.
            </div>
          `;

          return;
        }


        /* =====================================================
           RENDER EACH DAY
        ===================================================== */

        weekRows.forEach(row => {

          let colour =
            "day-grey";


          const paymentStatus =
            String(
              row.payment_status || ""
            )
            .trim()
            .toLowerCase();


          /* ================= PAID ================= */

          if (
            paymentStatus === "paid"
          ) {

            colour =
              "day-green";

          }


          /* ================= PARTIAL ================= */

          else if (
            paymentStatus === "partial"
          ) {

            colour =
              "day-orange";

          }


          /* ================= UNPAID ================= */

          else if (
            paymentStatus === "unpaid"
          ) {

            colour =
              "day-red";

          }


          /* ================= CREATE DAY BUTTON ================= */

          const btn =
            document.createElement(
              "button"
            );


          btn.className =
            `day-btn ${colour}`;


          btn.disabled =
            true;


          /* ================= AMOUNTS ================= */

          const expected =
            Number(
              row.expected_amount || 0
            );


          const paid =
            Number(
              row.amount_paid || 0
            );


          /* ================= DAY CONTENT ================= */

          btn.innerHTML = `

            <div style="
              font-size:15px;
              font-weight:bold;
            ">
              ${row.day_name || ""}
            </div>


            <div style="
              font-size:12px;
              margin-top:4px;
            ">
              ${row.remittance_date || ""}
            </div>


            <div style="
              font-size:12px;
              margin-top:6px;
            ">
              Expected:
              KES ${expected.toLocaleString()}
            </div>


            ${
              paid > 0
              ? `
                <div style="
                  font-size:11px;
                  margin-top:3px;
                ">
                  Paid:
                  KES ${paid.toLocaleString()}
                </div>
              `
              : ""
            }

          `;


          daysContainer.appendChild(
            btn
          );

        });


        /* =====================================================
           PAGINATION BUTTON STATES
        ===================================================== */

        prevBtn.disabled =
          currentWeekIndex === 0;


        nextBtn.disabled =
          currentWeekIndex ===
          weeks.length - 1;

      }


      /* =====================================================
         LOAD BALANCE
      ===================================================== */

      fetchCurrentBalance();

    }


    /* =====================================================
       REMITTANCE ERROR
    ===================================================== */

    catch (err) {

      console.error(
        "REMITTANCE ERROR:",
        err
      );


      daysContainer.innerHTML = `
        <div style="
          grid-column:1/-1;
          text-align:center;
          color:red;
          padding:15px;
        ">
          Failed to load remittance.
        </div>
      `;


      weekTitle.textContent =
        "Error";


      prevBtn.disabled = true;
      nextBtn.disabled = true;


      fetchCurrentBalance();

    }

  }


  /* =====================================================
     BALANCE
  ===================================================== */

  async function fetchCurrentBalance() {

    const balanceBox =
      document.getElementById(
        `driver-balance-${contract.id}`
      );


    try {

      const res = await fetch(
        `${BASE_URL}/contract-balance/${contract.id}`,
        {
          method: "GET",

          headers: {
            "Authorization": "Bearer " + token
          }

        }
      );


      if (!res.ok) {

        const errorText =
          await res.text();

        console.error(
          "BALANCE SERVER ERROR:",
          res.status,
          errorText
        );

        throw new Error(
          "Balance server returned " +
          res.status
        );

      }


      const data =
        await res.json();


      console.log(
        "BALANCE DATA:",
        data
      );


      let title =
        "Up To Date";


      let colour =
        "#1b8f2a";


      /* ================= DEBT ================= */

      if (
        data.type === "debt"
      ) {

        title =
          "Outstanding Debt";

        colour =
          "red";

      }


      /* ================= CREDIT ================= */

      else if (
        data.type === "credit"
      ) {

        title =
          "Credit Balance";

        colour =
          "green";

      }


      /* ================= DISPLAY BALANCE ================= */

      balanceBox.innerHTML = `

        ${title}:<br>

        <span style="
          color:${colour};
          font-size:18px;
          font-weight:bold;
        ">
          KES ${Number(
            data.balance || 0
          ).toLocaleString()}
        </span>

      `;

    }


    /* =====================================================
       BALANCE ERROR
    ===================================================== */

    catch (err) {

      console.error(
        "BALANCE ERROR:",
        err
      );


      balanceBox.innerHTML =
        "Unable to load balance.";

    }

  }

  }


              


        

/* ================= WEEK NUMBER ================= */

function getWeekNumber(date){

  const firstDay =
    new Date(date.getFullYear(), 0, 1);

  const pastDays =
    (date - firstDay) / 86400000;

  return Math.ceil(
    (pastDays + firstDay.getDay() + 1) / 7
  );
  }
