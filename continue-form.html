<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Continue Registration</title>

<style>
    body {
        font-family: sans-serif;
        padding: 20px;
        background: #f5f5f5;
    }
    h2 {
        color: #1b8f2a;
    }
    label {
        font-weight: bold;
        margin-top: 12px;
        display: block;
    }
    input[type="text"],
    input[type="date"],
    input[type="file"] {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        margin-bottom: 15px;
        border-radius: 6px;
        border: 1px solid #ccc;
        background: white;
    }
    button {
        width: 100%;
        background: #1b8f2a;
        padding: 14px;
        border: none;
        color: white;
        font-size: 18px;
        border-radius: 6px;
        margin-top: 20px;
    }
    #message {
        margin-top: 15px;
        padding: 12px;
        border-radius: 6px;
        display: none;
    }
    #message.error {
        background: #ffdddd;
        color: #a30000;
    }
    #message.success {
        background: #ddffdd;
        color: #006600;
    }
    .preview {
        width: 120px;
        margin-top: 6px;
        display: none;
    }
</style>

</head>
<body>

<h2>Continue Registration</h2>

<p>Please upload your documents to complete registration.</p>

<div id="message"></div>

<form id="uploadForm">

    <label>ID Number</label>
    <input type="text" id="id_number" required>

    <label>License Expiry Date</label>
    <input type="date" id="license_expiry" required>

    <label>PSV Badge Expiry Date</label>
    <input type="date" id="psv_badge_expiry" required>

    <label>Good Conduct Expiry Date</label>
    <input type="date" id="good_conduct_expiry" required>

    <label>Profile Picture</label>
    <input type="file" id="profile_pic" accept="image/*">
    <img id="prev_profile" class="preview">

    <label>Driving License</label>
    <input type="file" id="license" accept="image/*">
    <img id="prev_license" class="preview">

    <label>PSV Badge</label>
    <input type="file" id="psv_badge" accept="image/*">
    <img id="prev_psv" class="preview">

    <label>Good Conduct</label>
    <input type="file" id="good_conduct" accept="image/*">
    <img id="prev_gc" class="preview">

    <button type="submit">Upload Documents</button>
</form>

<script>
/* --- Extract token from URL --- */
const urlParams = new URLSearchParams(window.location.search);
const token = urlParams.get("token");
const submitBtn = document.querySelector("button[type='submit']");

if (!token) {
    showMessage("Missing token in URL", true);
    submitBtn.disabled = true;
}

/* --- Show messages --- */
function showMessage(msg, isError=false) {
    const div = document.getElementById("message");
    div.style.display = "block";
    div.textContent = msg;
    div.classList.remove("error", "success");
    div.classList.add(isError ? "error" : "success");
}

/* --- Image preview with URL cleanup --- */
function previewFile(input, previewImg) {
    let currentURL;
    input.addEventListener("change", () => {
        if (currentURL) URL.revokeObjectURL(currentURL);
        const file = input.files[0];
        if (file) {
            currentURL = URL.createObjectURL(file);
            previewImg.src = currentURL;
            previewImg.style.display = "block";
        } else {
            previewImg.style.display = "none";
        }
    });
}

previewFile(document.getElementById("profile_pic"), document.getElementById("prev_profile"));
previewFile(document.getElementById("license"), document.getElementById("prev_license"));
previewFile(document.getElementById("psv_badge"), document.getElementById("prev_psv"));
previewFile(document.getElementById("good_conduct"), document.getElementById("prev_gc"));

/* --- Form submission --- */
document.getElementById("uploadForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    // Required file validation
    const requiredFiles = ["profile_pic", "license", "psv_badge", "good_conduct"];
    for (let id of requiredFiles) {
        if (!document.getElementById(id).files[0]) {
            showMessage(`Please upload ${id.replace("_", " ")}`, true);
            return;
        }
    }

    const formData = new FormData();
    formData.append("token", token);
    formData.append("id_number", document.getElementById("id_number").value);
    formData.append("license_expiry", document.getElementById("license_expiry").value);
    formData.append("psv_badge_expiry", document.getElementById("psv_badge_expiry").value);
    formData.append("good_conduct_expiry", document.getElementById("good_conduct_expiry").value);

    requiredFiles.forEach(id => {
        formData.append(id, document.getElementById(id).files[0]);
    });

    submitBtn.disabled = true;
    showMessage("Uploading documents...", false);

    try {
        const res = await fetch("https://drivers-backend-4spp.onrender.com/upload-documents", {
            method: "POST",
            body: formData
        });

        let data;
        try { data = await res.json(); } catch { data = {}; }

        if (!res.ok) {
            showMessage(data.error || "Upload failed", true);
        } else {
            showMessage("Documents uploaded successfully!", false);
            // Optionally, clear the form here
            // document.getElementById("uploadForm").reset();
        }

    } catch (err) {
        showMessage("Network error. Try again.", true);
    } finally {
        submitBtn.disabled = false;
    }
});
    </script>
            

</body>
</html>
