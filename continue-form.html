<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Details</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 22px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.12);
        }

        h2 {
            color: #1b8f2a;
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            color: #1b8f2a;
            display: block;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #1b8f2a;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            background: #1b8f2a;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }

        button:active {
            background: #166d20;
        }

        .msg {
            display: none;
            padding: 12px;
            margin-top: 15px;
            border-radius: 8px;
            font-size: 15px;
        }

        .success {
            background: #d8ffd8;
            color: #0f6e12;
        }

        .error {
            background: #ffd6d6;
            color: #a30000;
        }

        /* PROFILE PIC PREVIEW */
        #preview {
            width: 120px;
            height: 120px;
            border-radius: 60px;
            object-fit: cover;
            display: block;
            margin-bottom: 15px;
            border: 2px solid #1b8f2a;
        }
    </style>
</head>
<body>

<div class="container">

    <h2>Update Your Details</h2>

    <input type="hidden" id="token">

    <!-- ID Number -->
    <label for="id_number">Enter Your ID Number</label>
    <input type="text" id="id_number" placeholder="e.g. 12345678">

    <!-- Number Plate -->
    <label for="number_plate">Enter Your Number Plate</label>
    <input type="text" id="number_plate" placeholder="e.g. KDK 123A">

    <!-- PROFILE PICTURE -->
    <label>Upload Profile Picture</label>
    <img id="preview" src="" style="display:none;">
    <input type="file" id="profile_pic" accept="image/*">

    <button onclick="saveDetails()">Save Details</button>

    <div id="msgBox" class="msg"></div>

</div>

<script>
    // Read token from URL
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");
    document.getElementById("token").value = token || "";

    function showMessage(text, type) {
        const msg = document.getElementById("msgBox");
        msg.textContent = text;
        msg.className = `msg ${type}`;
        msg.style.display = "block";
    }

    // PROFILE PICTURE PREVIEW
    document.getElementById("profile_pic").addEventListener("change", function() {
        if (this.files && this.files[0]) {
            const preview = document.getElementById("preview");
            preview.src = URL.createObjectURL(this.files[0]);
            preview.style.display = "block";
        }
    });

    async function uploadProfilePicture(tokenVal) {
        const fileInput = document.getElementById("profile_pic");
        if (!fileInput.files.length) {
            return { success: true }; // No picture uploaded → skip but not fail
        }

        const formPic = new FormData();
        formPic.append("token", tokenVal);
        formPic.append("profile_picture", fileInput.files[0]);

        try {
            const resPic = await fetch("https://drivers-backend-4spp.onrender.com/update-profile-picture", {
                method: "POST",
                body: formPic
            });

            return await resPic.json();
        } catch (e) {
            return { success: false, error: "Network error uploading profile picture." };
        }
    }

    async function saveDetails() {
        const tokenVal = document.getElementById("token").value.trim();
        const id = document.getElementById("id_number").value.trim();
        const plate = document.getElementById("number_plate").value.trim();

        if (!tokenVal) {
            showMessage("Token missing. Open the link from your email.", "error");
            return;
        }

        if (!id) {
            showMessage("ID number is required.", "error");
            return;
        }

        if (!plate) {
            showMessage("Number plate is required.", "error");
            return;
        }

        // First: update ID number
        const formID = new FormData();
        formID.append("token", tokenVal);
        formID.append("id_number", id);

        let updatePlateAllowed = false;

        try {
            const resID = await fetch("https://drivers-backend-4spp.onrender.com/update-id", {
                method: "POST",
                body: formID
            });

            const dataID = await resID.json();

            if (!dataID.success) {
                showMessage(dataID.error || "Error saving ID number", "error");
                return;
            }

            updatePlateAllowed = true;

        } catch (e) {
            showMessage("Network error updating ID number.", "error");
            return;
        }

        // Then: update number plate
        if (updatePlateAllowed) {
            const formPlate = new FormData();
            formPlate.append("token", tokenVal);
            formPlate.append("number_plate", plate);

            try {
                const resPlate = await fetch("https://drivers-backend-4spp.onrender.com/update-number-plate", {
                    method: "POST",
                    body: formPlate
                });

                const dataPlate = await resPlate.json();

                if (!dataPlate.success) {
                    showMessage(dataPlate.error || "Error saving number plate", "error");
                    return;
                }

            } catch (e) {
                showMessage("Network error updating number plate.", "error");
                return;
            }
        }

        // Finally: upload profile picture
        const picResult = await uploadProfilePicture(tokenVal);

        if (!picResult.success) {
            showMessage(picResult.error || "Error uploading profile picture.", "error");
            return;
        }

        showMessage("All details saved successfully!", "success");
    }
</script>

</body>
</html>
