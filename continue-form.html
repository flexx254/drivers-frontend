<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Update Details</title>
<style>

  :root {
  --main-green: #1b8f2a;
  --white: #ffffff;
  }
body { font-family: Arial, sans-serif; margin:0; padding:0px; background:#f5f5f5; }
.container { max-width:500px; margin:auto; background:white; padding:22px; border-radius:10px; box-shadow:0 3px 10px rgba(0,0,0,0.12); }
h2 { color:#1b8f2a; text-align:center; margin-bottom:20px; }
label { font-weight:bold; color:#1b8f2a; display:block; margin-bottom:6px; }
input { width:100%; padding:12px; border:2px solid #1b8f2a; border-radius:8px; font-size:16px; margin-bottom:20px; }
button { width:100%; background:#1b8f2a; color:white; padding:14px; border:none; border-radius:8px; font-size:18px; cursor:pointer; }
button:active { background:#166d20; }
.msg { display:none; padding:12px; margin-top:15px; border-radius:8px; font-size:15px; }
.success { background:#d8ffd8; color:#0f6e12; }
.error { background:#ffd6d6; color:#a30000; }
img.preview { width:120px; height:120px; object-fit:cover; display:block; margin-bottom:15px; border:2px solid #1b8f2a; border-radius:8px; }
/* HEADER */
header {
  background-color: var(--main-green);
  color: var(--white);
  padding: 15px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: relative;
}

header .logo {
  font-size: 20px;
  font-weight: bold;
}

header .menu-icon {
  font-size: 24px;
  cursor: pointer;
  display: none;
}

nav {
  display: flex;
  gap: 20px;
}

nav a {
  color: var(--white);
  text-decoration: none;
  font-weight: 500;
}

nav.active {
  display: block;
  position: absolute;
  top: 60px;
  right: 20px;
  background-color: var(--main-green);
  padding: 15px;
  border-radius: 5px;
  width: 150px;
}

nav.active a {
  display: block;
  margin: 10px 0;
}

/* RESPONSIVE */
@media screen and (max-width: 768px) {
  nav {
    display: none;
    flex-direction: column;
  }
  header .menu-icon {
    display: block;
  }
}

/* FOOTER */
footer {
  background-color: var(--main-green);
  color: var(--white);
  text-align: center;
  padding: 15px;
  margin-top: auto;
    }
 </style>
</head>
<header>
  <div class="logo">Driver App</div>
  <div class="menu-icon" id="menuToggle"><i class="fas fa-bars"></i></div>
  <nav id="navMenu">
    <a href="#">Home</a>
    <a href="#">Login</a>
    <a href="#">About</a>
  </nav>
</header>

<body>

<div class="container">

<h2>Update Your Details</h2>

<input type="hidden" id="token">

<label for="id_number">Enter Your ID Number</label>
<input type="text" id="id_number" placeholder="e.g. 12345678">

<label for="number_plate">Enter Your Number Plate</label>
<input type="text" id="number_plate" placeholder="e.g. KDK 123A">

<label>Upload Profile Picture</label>
<img id="preview" class="preview" style="display:none;">
<input type="file" id="profile_pic" accept="image/*">

<!-- Driving License -->
<label>Upload Driving License</label>
<img id="license_preview" class="preview" style="display:none;">
<input type="file" id="driving_license" accept="image/*">
<label for="license_expiry">License Expiry Date</label>
<input type="date" id="license_expiry">

<!-- PSV Badge -->
<label>Upload PSV Badge</label>
<img id="psv_preview" class="preview" style="display:none;">
<input type="file" id="psv_badge" accept="image/*">
<label for="psv_badge_expiry">PSV Badge Expiry Date</label>
<input type="date" id="psv_badge_expiry">

<!-- Good Conduct -->
<label>Upload Good Conduct Certificate</label>
<img id="gc_preview" class="preview" style="display:none;">
<input type="file" id="good_conduct" accept="image/*">
<label for="good_conduct_expiry">Good Conduct Expiry Date</label>
<input type="date" id="good_conduct_expiry">

<button onclick="saveDetails()">Save Details</button>
<div id="msgBox" class="msg"></div>

</div>
<footer>
  &copy; 2025 Driver App. All rights reserved.
</footer>
    
<script>
// Get token from URL
const params = new URLSearchParams(window.location.search);
const token = params.get("token");
document.getElementById("token").value = token || "";

// Show messages
function showMessage(text, type){
    const msg = document.getElementById("msgBox");
    msg.textContent = text;
    msg.className = `msg ${type}`;
    msg.style.display = "block";
}

// Image previews
function setupPreview(inputId, previewId){
    document.getElementById(inputId).addEventListener("change", function(){
        if(this.files && this.files[0]){
            const preview = document.getElementById(previewId);
            preview.src = URL.createObjectURL(this.files[0]);
            preview.style.display = "block";
        }
    });
}

// Setup previews
setupPreview("profile_pic","preview");
setupPreview("driving_license","license_preview");
setupPreview("psv_badge","psv_preview");
setupPreview("good_conduct","gc_preview");

// ---------------------
// FIXED FILE UPLOAD
// ---------------------
async function uploadFile(tokenVal, fileInputId, expiryId, route){
    const fileInput = document.getElementById(fileInputId);
    if(!fileInput.files.length) return {success:true}; // no file selected

    const form = new FormData();
    form.append("token", tokenVal);

    // Correct keys for the backend
    if(fileInputId === "profile_pic"){
        form.append("profile_picture", fileInput.files[0]);
    }
    if(fileInputId === "driving_license"){
        form.append("driving_license", fileInput.files[0]);
    }
    if(fileInputId === "psv_badge"){
        form.append("psv_badge", fileInput.files[0]);
    }
    if(fileInputId === "good_conduct"){
        form.append("good_conduct", fileInput.files[0]);
    }

    if(expiryId){
        const expiryValue = document.getElementById(expiryId).value || "";
        form.append(expiryId, expiryValue);
    }

    try{
        const res = await fetch(`https://drivers-backend-4spp.onrender.com/${route}`, {
            method: "POST",
            body: form
        });
        return await res.json();
    }catch(e){
        return {success:false, error:`Network error uploading ${fileInputId}`};
    }
}

// Upload profile picture separately
async function uploadProfilePicture(tokenVal){
    return uploadFile(tokenVal, "profile_pic", null, "update-profile-picture");
}

// ---------------------
// SAVE DETAILS
// ---------------------
async function saveDetails(){
    const tokenVal = document.getElementById("token").value.trim();
    const id = document.getElementById("id_number").value.trim();
    const plate = document.getElementById("number_plate").value.trim();

    if(!tokenVal){ showMessage("Token missing. Open the link from your email.","error"); return; }
    if(!id){ showMessage("ID number is required.","error"); return; }
    if(!plate){ showMessage("Number plate is required.","error"); return; }

    // --- Update ID ---
    const formID = new FormData();
    formID.append("token", tokenVal);
    formID.append("id_number", id);

    try{
        const res = await fetch("https://drivers-backend-4spp.onrender.com/update-id", {
            method:"POST",
            body:formID
        });
        const data = await res.json();
        if(!data.success){
            showMessage(data.error || "Error saving ID number","error");
            return;
        }
    }catch(e){
        showMessage("Network error updating ID number.","error");
        return;
    }

    // --- Update number plate ---
    const formPlate = new FormData();
    formPlate.append("token", tokenVal);
    formPlate.append("number_plate", plate);

    try{
        const res = await fetch("https://drivers-backend-4spp.onrender.com/update-number-plate", {
            method:"POST",
            body:formPlate
        });
        const data = await res.json();
        if(!data.success){
            showMessage(data.error || "Error saving number plate","error");
            return;
        }
    }catch(e){
        showMessage("Network error updating number plate.","error");
        return;
    }

    // --- Upload profile picture ---
    let result = await uploadProfilePicture(tokenVal);
    if(!result.success){
        showMessage(result.error,"error");
        return;
    }

    // --- Upload documents ---
    const docs = [
        {id:"driving_license", expiry:"license_expiry", route:"update-driving-license"},
        {id:"psv_badge", expiry:"psv_badge_expiry", route:"update-psv-badge"},
        {id:"good_conduct", expiry:"good_conduct_expiry", route:"update-good-conduct"}
    ];

    for(const doc of docs){
        result = await uploadFile(tokenVal, doc.id, doc.expiry, doc.route);
        if(!result.success){
            showMessage(result.error,"error");
            return;
        }
    }

    showMessage("All details saved successfully!","success");
}

/* RESPONSIVE MENU */
const menuToggle = document.getElementById('menuToggle');
const navMenu = document.getElementById('navMenu');

menuToggle.addEventListener('click', () => {
  navMenu.classList.toggle('active');
  if (navMenu.classList.contains('active')) {
    menuToggle.innerHTML = '<i class="fas fa-times"></i>';
  } else {
    menuToggle.innerHTML = '<i class="fas fa-bars"></i>';
  }
});
            
    </script>

</body>
</html>
