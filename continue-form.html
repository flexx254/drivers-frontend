<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update ID Number</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 22px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.12);
        }

        h2 {
            color: #1b8f2a;
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            color: #1b8f2a;
            display: block;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #1b8f2a;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            background: #1b8f2a;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }

        button:active {
            background: #166d20;
        }

        .msg {
            display: none;
            padding: 12px;
            margin-top: 15px;
            border-radius: 8px;
            font-size: 15px;
        }

        .success {
            background: #d8ffd8;
            color: #0f6e12;
        }

        .error {
            background: #ffd6d6;
            color: #a30000;
        }
    </style>
</head>
<body>

<div class="container">

    <h2>Update ID Number</h2>

    <input type="hidden" id="token">

    <label for="id_number">Enter Your ID Number</label>
    <input type="text" id="id_number" placeholder="e.g. 12345678">

    <button onclick="saveID()">Save ID Number</button>

    <div id="msgBox" class="msg"></div>

</div>

<script>
    // Read token from ?token=XYZ in the email link
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");

    document.getElementById("token").value = token || "";

    function showMessage(text, type) {
        const msg = document.getElementById("msgBox");
        msg.textContent = text;
        msg.className = `msg ${type}`;
        msg.style.display = "block";
    }

    async function saveID() {
        const id = document.getElementById("id_number").value.trim();
        const tokenVal = document.getElementById("token").value.trim();

        if (!tokenVal) {
            showMessage("Token missing. Open the link from your email.", "error");
            return;
        }

        if (!id) {
            showMessage("ID number is required.", "error");
            return;
        }

        const formData = new FormData();
        formData.append("token", tokenVal);
        formData.append("id_number", id);

        try {
            const res = await fetch("https://drivers-backend-4spp.onrender.com/update-id", {
                method: "POST",
                body: formData
            });

            const data = await res.json();

            if (data.success) {
                showMessage("ID number saved successfully!", "success");
            } else {
                showMessage(data.error || "Error saving ID number", "error");
            }

        } catch (e) {
            showMessage("Network error. Try again.", "error");
        }
    }
</script>

</body>
</html>
