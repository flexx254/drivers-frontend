<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Update Details</title>
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"> 
 <link rel="stylesheet" href="css/continue-form.css">





</head>


<body>

 <header>

    <div class="logo">
  <img src="assets/logo/d4d-logo.png" alt="D4D Logo">
    </div>
  <div class="menu-icon" id="menuToggle"><i class="fas fa-bars"></i></div>
  <nav id="navMenu">
    <a href="#">Home</a>
    <a href="#">Login</a>
    <a href="#">About</a>
  </nav>
</header>

<div class="container">

<h2>Update Your Details</h2>



<label for="id_number">Enter Your ID Number</label>
<input type="text" id="id_number" placeholder="e.g. 12345678">

<label for="number_plate">Enter Your Number Plate</label>
<input type="text" id="number_plate" placeholder="e.g. KDK 123A">

<label>Upload Profile Picture</label>
<img id="preview" class="preview" style="display:none;">
<input type="file" id="profile_pic" accept="image/*">

<!-- Driving License -->
<label>Upload Driving License</label>
<img id="license_preview" class="preview" style="display:none;">
<input type="file" id="driving_license" accept="image/*">
<label for="license_expiry">License Expiry Date</label>
<input type="date" id="license_expiry">

<!-- PSV Badge -->
<label>Upload PSV Badge</label>
<img id="psv_preview" class="preview" style="display:none;">
<input type="file" id="psv_badge" accept="image/*">
<label for="psv_badge_expiry">PSV Badge Expiry Date</label>
<input type="date" id="psv_badge_expiry">

<!-- Good Conduct -->
<label>Upload Good Conduct Certificate</label>
<img id="gc_preview" class="preview" style="display:none;">
<input type="file" id="good_conduct" accept="image/*">
<label for="good_conduct_expiry">Good Conduct Expiry Date</label>
<input type="date" id="good_conduct_expiry">

<button id="saveBtn" onclick="saveDetails()">
  Save Details
  <div class="spinner" id="btnSpinner"></div>
</button>
<div id="msgBox" class="msg"></div>

</div>
<footer>
  &copy; 2025 Driver App. All rights reserved.
</footer>
    

   <script>

("btnSpinner").style.display = "block";
}

function hideSpinner(){
    const btn = document.getElementById("saveBtn");
    btn.disabled = false;
    document.getElementById("btnSpinner").style.display = "none";
}

// ============================
// SAVE DETAILS FUNCTION
// ============================
async function saveDetails(){
    showSpinner();

    const id = document.getElementById("id_number").value.trim();
    const plate = document.getElementById("number_plate").value.trim();

    if(!id){
        showMessage("ID number is required.","error");
        hideSpinner();
        return;
    }

    if(!plate){
        showMessage("Number plate is required.","error");
        hideSpinner();
        return;
    }

    // --- Update ID ---
    try{
        const formID = new FormData();
        formID.append("id_number", id);

        const resID = await fetch("https://drivers-backend-4spp.onrender.com/update-id", {
            method:"POST",
            headers: {
                "Authorization": "Bearer " + getToken()
            },
            body:formID
        });

        if(handleUnauthorized(resID)) return;

        const dataID = await resID.json();
        if(!dataID.success){
            showMessage(dataID.error || "Error saving ID number","error");
            hideSpinner();
            return;
        }

    }catch(e){
        showMessage("Network error updating ID number.","error");
        hideSpinner();
        return;
    }

    // --- Update Number Plate ---
    try{
        const formPlate = new FormData();
        formPlate.append("number_plate", plate);

        const resPlate = await fetch("https://drivers-backend-4spp.onrender.com/update-number-plate", {
            method:"POST",
            headers: {
                "Authorization": "Bearer " + getToken()
            },
            body:formPlate
        });

        if(handleUnauthorized(resPlate)) return;

        const dataPlate = await resPlate.json();
        if(!dataPlate.success){
            showMessage(dataPlate.error || "Error saving number plate","error");
            hideSpinner();
            return;
        }

    }catch(e){
        showMessage("Network error updating number plate.","error");
        hideSpinner();
        return;
    }

    // --- Upload Profile Picture ---
    const resultProfile = await uploadFile("profile_pic", null, "update-profile-picture");
    if(!resultProfile.success){
        showMessage(resultProfile.error || "Error uploading profile picture","error");
        hideSpinner();
        return;
    }

    // --- Upload Other Documents ---
    const docs = [
        {id:"driving_license", expiry:"license_expiry", route:"update-driving-license"},
        {id:"psv_badge", expiry:"psv_badge_expiry", route:"update-psv-badge"},
        {id:"good_conduct", expiry:"good_conduct_expiry", route:"update-good-conduct"}
    ];

    for(const doc of docs){
        const res = await uploadFile(doc.id, doc.expiry, doc.route);
        if(!res.success){
            showMessage(res.error || "Error uploading document","error");
            hideSpinner();
            return;
        }
    }

    hideSpinner();
    showMessage("All details saved successfully!","success");
}

// ============================
// RESPONSIVE MENU
// ============================
const menuToggle = document.getElementById('menuToggle');
const navMenu = document.getElementById('navMenu');

menuToggle.addEventListener('click', () => {
  navMenu.classList.toggle('active');
  menuToggle.innerHTML = navMenu.classList.contains('active') 
      ? '<i class="fas fa-times"></i>' 
      : '<i class="fas fa-bars"></i>';
});

</script>
