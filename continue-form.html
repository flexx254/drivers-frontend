<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Update Details</title>

<meta
    http-equiv="Content-Security-Policy"
    content="
        default-src 'self';
        base-uri 'self';
        object-src 'none';
        form-action 'self';
        script-src 'self';
        style-src 'self' https://cdnjs.cloudflare.com;
        font-src 'self' https://cdnjs.cloudflare.com data:;
        img-src 'self' data: blob:;
        connect-src 'self' https://drivers-backend-4spp.onrender.com;
    "
>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="css/continue-form.css">

</head><body><header>

    <div class="logo">
        <img src="assets/logo/d4d-logo.png" alt="D4D Logo">
    </div>

    <div class="menu-icon" id="menuToggle">
        <i class="fas fa-bars"></i>
    </div>

    <nav id="navMenu">
        <a href="#">Home</a>
        <a href="#">Login</a>
        <a href="#">About</a>
    </nav>

</header>

<div class="container">

    <h2>Update Your Details</h2>

    <label for="id_number">Enter Your ID Number</label>
    <input type="text" id="id_number" placeholder="e.g. 12345678">

    <label for="number_plate">Enter Your Number Plate</label>
    <input type="text" id="number_plate" placeholder="e.g. KDK 123A">

    <label>Upload Profile Picture</label>
    <img id="preview" class="preview" hidden>
    <input type="file" id="profile_pic" accept="image/*">

    <!-- Driving License -->
    <label>Upload Driving License</label>
    <img id="license_preview" class="preview" hidden>
    <input type="file" id="driving_license" accept="image/*">

    <label for="license_expiry">License Expiry Date</label>
    <input type="date" id="license_expiry">

    <!-- PSV Badge -->
    <label>Upload PSV Badge</label>
    <img id="psv_preview" class="preview" hidden>
    <input type="file" id="psv_badge" accept="image/*">

    <label for="psv_badge_expiry">PSV Badge Expiry Date</label>
    <input type="date" id="psv_badge_expiry">

    <!-- Good Conduct -->
    <label>Upload Good Conduct Certificate</label>
    <img id="gc_preview" class="preview" hidden>
    <input type="file" id="good_conduct" accept="image/*">

    <label for="good_conduct_expiry">Good Conduct Expiry Date</label>
    <input type="date" id="good_conduct_expiry">

    <button id="saveBtn" type="button">
        Save Details
        <div class="spinner" id="btnSpinner"></div>
    </button>

    <div id="msgBox" class="msg"></div>

</div>

<footer>
    &copy; 2025 Driver App. All rights reserved.
</footer>

<script src="js/continue-form.js" defer></script>

</body>
</html>
