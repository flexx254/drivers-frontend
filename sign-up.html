<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D4D Driver Signup</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #e8f5e9;
      padding: 20px;
      color: #003300;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px #aaa;
    }

    h2 {
      text-align: center;
      color: #0a5c0a;
    }

    label {
      font-weight: bold;
      margin-top: 10px;
      display: block;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #0a5c0a;
      border-radius: 5px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #0a5c0a;
      border: none;
      color: white;
      font-size: 18px;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 20px;
    }

    button:hover {
      background: #0c7c0c;
    }

    .message {
      margin-top: 15px;
      font-weight: bold;
      text-align: center;
    }

    #otp-section {
      display: none;
    }
  </style>
</head>

<body>

<div class="container">
  <h2>D4D Driver Signup</h2>

  <form id="signupForm">
    <label>Full Name</label>
    <input type="text" name="full_name" required>

    <label>Email</label>
    <input type="email" name="email" required>

    <label>Password</label>
    <input type="password" name="password" required>

    <label>PSV Expiry</label>
    <input type="date" name="psv_expiry" required>

    <label>Car Plate</label>
    <input type="text" name="car_plate" placeholder="KDA123A" required>

    <label>Sacco</label>
    <select name="sacco" required>
      <option value="">Select Sacco</option>
      <option value="OOD">OOD</option>
      <option value="UOD">UOD</option>
      <option value="NONE">NONE</option>
    </select>

    <label>Profile Photo</label>
    <input type="file" name="profile_photo" accept="image/*" required>

    <label>PSV Badge</label>
    <input type="file" name="psv_badge" accept="image/*" required>

    <button type="submit">Sign Up</button>

    <div class="message" id="signupMsg"></div>
  </form>

  <!-- OTP SECTION -->
  <div id="otp-section">
    <h3>Email Verification</h3>

    <label>Enter OTP</label>
    <input type="text" id="otpInput" placeholder="6-digit code">

    <button id="verifyBtn">Verify OTP</button>

    <div class="message" id="otpMsg"></div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
