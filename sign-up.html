<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="css/drivereg.css">

<script src="js/drivereg.js" defer></script>


  

</head>
<body>

<header>
  <div class="logo">
  <img src="assets/logo/d4d-logo.png" alt="D4D Logo">
  </div>
  <div class="menu-icon" id="menuToggle"><i class="fas fa-bars"></i></div>
  <nav id="navMenu">
    <a href="#">Home</a>
    <a href="#">Login</a>
    <a href="#">About</a>
  </nav>
</header>

<div class="container">
  <h2>Create Account</h2>

  <input id="name" placeholder="Enter full name" />
  <input id="email" placeholder="Enter email" />

<label for="phone_number">Phone</label>
<input id="phone_number" name="phone" type="tel" 
       value="+254" maxlength="13" 
       placeholder="+2547xxxxxxxx" 
       autocomplete="tel" required
       aria-describedby="phoneError"
       oninput="autoInsertPrefix()" />

<div id="phoneError" class="error" aria-live="polite" style="display:none;"></div>
  <select id="sacco">
    <option value="">Select Sacco</option>
    <option value="OOD">OOD</option>
    <option value="DOD">DOD</option>
    <option value="NONE">NONE</option>
  
  </select>

  <div class="password-wrapper">
    <input id="password" type="password" placeholder="Enter password" />
    <span class="toggle-eye" onclick="togglePassword('password', this)">👁️</span>
  </div>

  <div class="password-wrapper">
    <input id="confirm" type="password" placeholder="Confirm password" />
    <span class="toggle-eye" onclick="togglePassword('confirm', this)">👁️</span>
  </div>

  <button onclick="registerUser()">Submit</button>
  <div id="errorBox"></div>
  <div id="successBox"></div>

    <div class="extra-links">
  <a href="/login">Already have an account? Sign In</a>
  <a href="/forgot-password">Forgot Password?</a>
  </div>
</div>


<footer>
  &copy; 2025 Driver App. All rights reserved.
</footer>

<div class="desktop-overlay" aria-hidden="true">
    <div class="overlay-content">
        <i class="fas fa-mobile-alt"></i>
        <h2>Mobile Access Only</h2>
        <p>
            This page is currently optimized for mobile devices only.
            Please open it on a smartphone for the best experience.
        </p>
    </div>
  </div>

</body>
    </html>
