<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>D4D Driver Signup</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="logo">D4D</div>
    <button class="hamburger" id="hamburger">&#9776;</button>
    <nav id="nav-menu">
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Signup</a></li>
        <li><a href="#">About</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Driver Signup</h1>
    <form id="signupForm">
      <input type="text" name="full_name" placeholder="Full Name" required />
      <input type="email" name="email" placeholder="Email" required />
      <input type="password" name="password" placeholder="Password" required />
      <input type="text" name="car_plate" placeholder="Car Plate" required />
      <input type="text" name="sacco" placeholder="Sacco" required />
      <input type="date" name="psv_expiry" placeholder="PSV Expiry" required />
      <label>Profile Photo</label>
      <input type="file" name="profile_photo" accept="image/*" required />
      <label>PSV Badge</label>
      <input type="file" name="psv_badge" accept="image/*" required />
      <button type="submit">Signup</button>
    </form>
    <div id="response"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
