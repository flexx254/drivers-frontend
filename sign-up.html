<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Register</title>

<!-- CONTENT SECURITY POLICY -->
<meta
  http-equiv="Content-Security-Policy"
  content="
    default-src 'self';
    base-uri 'self';
    object-src 'none';
    frame-ancestors 'none';
    form-action 'self';
    script-src 'self';
    style-src 'self' https://cdnjs.cloudflare.com;
    font-src 'self' https://cdnjs.cloudflare.com;
    img-src 'self' data:;
    connect-src 'self' https://drivers-backend-4spp.onrender.com;
    upgrade-insecure-requests;
  "
>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link rel="stylesheet" href="css/drivereg.css">

<script src="js/drivereg.js" defer></script>

</head>
<body>

<header>
  <div class="logo">
  <img src="assets/logo/d4d-logo.png" alt="D4D Logo">
  </div>
  <div class="menu-icon" id="menuToggle"><i class="fas fa-bars"></i></div>
  <nav id="navMenu">
    <a href="#">Home</a>
    <a href="#">Login</a>
    <a href="#">About</a>
  </nav>
</header>
<div class="container">
  <h2>Create Account</h2>

  <input
    id="name"
    name="name"
    type="text"
    placeholder="Enter full name"
    autocomplete="name"
    required
  />

  <input
    id="email"
    name="email"
    type="email"
    placeholder="Enter email"
    autocomplete="email"
    required
  />

  <label for="phone_number">Phone</label>
  <input
    id="phone_number"
    name="phone"
    type="tel"
    value="+254"
    maxlength="13"
    placeholder="+2547xxxxxxxx"
    autocomplete="tel"
    inputmode="numeric"
    required
    aria-describedby="phoneError"
  />

  <div
    id="phoneError"
    class="error"
    aria-live="polite"
    hidden
  ></div>

  <select id="sacco" name="sacco" required>
    <option value="">Select Sacco</option>
    <option value="OOD">OOD</option>
    <option value="DOD">DOD</option>
    <option value="NONE">NONE</option>
  </select>

  <div class="password-wrapper">
    <input
      id="password"
      name="password"
      type="password"
      placeholder="Enter password"
      autocomplete="new-password"
      required
    />

    <button
      type="button"
      class="toggle-eye"
      data-target="password"
      aria-label="Show password"
    >👁️</button>
  </div>

  <div class="password-wrapper">
    <input
      id="confirm"
      name="confirm"
      type="password"
      placeholder="Confirm password"
      autocomplete="new-password"
      required
    />

    <button
      type="button"
      class="toggle-eye"
      data-target="confirm"
      aria-label="Show confirm password"
    >👁️</button>
  </div>

  <button type="button" id="registerBtn">Submit</button>

  <div id="errorBox" role="alert" aria-live="polite"></div>
  <div id="successBox" role="status" aria-live="polite"></div>

  <div class="extra-links">
    <a href="/login">Already have an account? Sign In</a>
    <a href="/forgot-password">Forgot Password?</a>
  </div>
</div>

<footer>
  &copy; 2025 Driver App. All rights reserved.
                               </footer>



</body>
</html>
