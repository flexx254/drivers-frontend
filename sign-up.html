<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register Name</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      font-size: 16px;
    }
    #response {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      font-size: 15px;
      display: none;
    }
    .error { background: #ffdddd; color: red; }
    .success { background: #ddffdd; color: green; }
  </style>
</head>
<body>

  <h2>Register Full Name</h2>

  <input id="fullName" type="text" placeholder="Enter full name (3 names)" />

  <button onclick="registerName()">Submit</button>

  <div id="response"></div>

  <script>
    async function registerName() {
      const name = document.getElementById("fullName").value.trim();
      const resBox = document.getElementById("response");

      // Reset response box
      resBox.style.display = "none";

      // Local validation
      const nameParts = name.split(" ");
      if (nameParts.length !== 3) {
        resBox.className = "error";
        resBox.innerText = "Full name must contain exactly 3 names.";
        resBox.style.display = "block";
        return;
      }

      try {
        const response = await fetch("https://drivers-backend-4spp.onrender.com/register-name", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ full_name: name })
        });

        const data = await response.json();

        if (!response.ok) {
          resBox.className = "error";
          resBox.innerText = data.error || "An error occurred.";
          resBox.style.display = "block";
        } else {
          resBox.className = "success";
          resBox.innerText = data.message || "Name registered successfully.";
          resBox.style.display = "block";
        }

      } catch (err) {
        resBox.className = "error";
        resBox.innerText = "Network error. Check your backend.";
        resBox.style.display = "block";
      }
    }
  </script>

</body>
</html>
