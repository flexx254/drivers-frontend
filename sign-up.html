<!DOCTYPE html>
<html>
<head>
  <title>Register</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    input, select { display:block; width:100%; padding:10px; margin:10px 0; }
    button { padding:10px 20px; width:100%; }
    #errorBox { color:red; margin-top:10px; white-space:pre-line; }
    #successBox { color:green; margin-top:10px; }

    .password-wrapper {
      position: relative;
      width: 100%;
    }

    .toggle-eye {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      user-select: none;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="container">
  <h2>Create Account</h2>

  <input id="name" placeholder="Enter full name" />
  <input id="email" placeholder="Enter email" />

  <!-- PHONE NUMBER -->
  <input id="phone_number" placeholder="Enter phone number (+2547...)" />

  <!-- SACCO -->
  <select id="sacco">
    <option value="">Select Sacco</option>
    <option value="OOD">OOD</option>
    <option value="DOD">DOD</option>
    <option value="NONE">NONE</option>
  </select>

  <!-- PASSWORD WITH EYE -->
  <div class="password-wrapper">
    <input id="password" type="password" placeholder="Enter password" />
    <span class="toggle-eye" onclick="togglePassword('password', this)">👁️</span>
  </div>

  <!-- CONFIRM PASSWORD WITH EYE -->
  <div class="password-wrapper">
    <input id="confirm" type="password" placeholder="Confirm password" />
    <span class="toggle-eye" onclick="togglePassword('confirm', this)">👁️</span>
  </div>

  <button onclick="registerUser()">Submit</button>

  <div id="errorBox"></div>
  <div id="successBox"></div>
  </div>
<script>
function togglePassword(id, el) {
  const input = document.getElementById(id);
  if (input.type === "password") {
    input.type = "text";
    el.textContent = "🙈";
  } else {
    input.type = "password";
    el.textContent = "👁️";
  }
}

function validateFrontend(name, email, phone, sacco, password, confirm) {
  let errors = [];

  if (!name) errors.push("Name is required.");

  // EMAIL
  if (!email) {
    errors.push("Email is required.");
  } else {
    const emailRegex = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;
    if (!emailRegex.test(email)) {
      errors.push("Enter a valid email address.");
    }
  }

  // PHONE NUMBER (+254XXXXXXXXX)
  const phoneRegex = /^\+254\d{9}$/;
  if (!phoneRegex.test(phone)) {
    errors.push("Phone must be in +254XXXXXXXXX format.");
  }

  // SACCO
  if (!sacco) {
    errors.push("Please select a sacco.");
  }

  // PASSWORD RULES
  if (password.length < 8) errors.push("Password must be at least 8 characters.");
  if (!/[A-Z]/.test(password)) errors.push("At least one capital letter required.");
  if (!/[a-z]/.test(password)) errors.push("At least one lowercase letter required.");
  if (!/[0-9]/.test(password)) errors.push("At least one number required.");
  if (!/[!@#$%^&*(),.?\":{}|<>]/.test(password)) errors.push("At least one special character required.");

  if (password !== confirm) errors.push("Passwords do not match.");

  return errors;
}

async function registerUser() {
  document.getElementById("errorBox").textContent = "";
  document.getElementById("successBox").textContent = "";

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim().toLowerCase();
  const phone_number = document.getElementById("phone_number").value.trim();
  const sacco = document.getElementById("sacco").value;
  const password = document.getElementById("password").value;
  const confirm = document.getElementById("confirm").value;

  // FRONTEND VALIDATION
  const errors = validateFrontend(name, email, phone_number, sacco, password, confirm);
  if (errors.length > 0) {
    document.getElementById("errorBox").textContent = errors.join("\n");
    return;
  }

  // STEP 1 — REGISTER
  let regData;
  try {
    const res = await fetch("https://drivers-backend-4spp.onrender.com/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, email, phone_number, sacco, password, confirm })
    });

    regData = await res.json();
  } catch (err) {
    document.getElementById("errorBox").textContent = "Network error during registration: " + err;
    return;
  }

  if (!regData.success) {
    document.getElementById("errorBox").textContent = regData.error;
    return;
  }

  // STEP 2 — SEND CONTINUE REG EMAIL
  let contData;
  try {
    const res2 = await fetch("https://drivers-backend-4spp.onrender.com/continue-reg", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email })
    });

    contData = await res2.json();
  } catch (err) {
    document.getElementById("errorBox").textContent = "Network error sending email: " + err;
    return;
  }

  if (!contData.success) {
    document.getElementById("errorBox").textContent = contData.error;
    return;
  }

  document.getElementById("successBox").textContent =
    "Registration complete! Check your email to continue ✔";
}
</script>

</body>
</html>
