<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D4D Backend Tester</title>

<style>
  body { font-family: Arial; padding: 10px; background:#f4f4f4; }
  .box { background:white; padding:15px; border-radius:10px; margin-bottom:15px; }
  input, select { width:100%; padding:10px; margin-top:5px; margin-bottom:10px; }
  button { width:100%; padding:12px; background:green; color:white; border:none; font-size:16px; }
  #output { white-space:pre-wrap; background:black; color:#0f0; padding:10px; border-radius:10px; margin-top:10px; }
  .loading { color:blue; font-weight:bold; }
</style>

</head>
<body>

<h2>D4D BACKEND TESTER</h2>

<div class="box">
  <h3>Signup Test</h3>

  <label>Full Name</label>
  <input id="full_name">

  <label>Email</label>
  <input id="email" type="email">

  <label>Password</label>
  <input id="password" type="password">

  <label>PSV Expiry (YYYY-MM-DD)</label>
  <input id="psv_expiry" type="date">

  <label>Car Plate</label>
  <input id="car_plate">

  <label>Sacco</label>
  <select id="sacco">
    <option value="">Select</option>
    <option value="OOD">OOD</option>
    <option value="UOD">UOD</option>
    <option value="NONE">NONE</option>
  </select>

  <label>Profile Photo</label>
  <input id="profile_photo" type="file" accept="image/*">

  <label>PSV Badge</label>
  <input id="psv_badge" type="file" accept="image/*">

  <button onclick="submitSignup()">Submit Signup</button>
</div>

<div id="output">Waiting...</div>

<script>
const BASE = "https://drivers-backend-4spp.onrender.com";

function log(msg, color="lime") {
  const box = document.getElementById("output");
  box.style.color = color;
  box.textContent = msg;
}

async function submitSignup() {
  log("Sending request...\nPlease wait...", "yellow");

  try {
    // FRONTEND VALIDATION
    const full_name = document.getElementById("full_name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();
    const psv_expiry = document.getElementById("psv_expiry").value.trim();
    const car_plate = document.getElementById("car_plate").value.trim();
    const sacco = document.getElementById("sacco").value.trim();
    const profile = document.getElementById("profile_photo").files[0];
    const badge = document.getElementById("psv_badge").files[0];

    if (!full_name || !email || !password || !psv_expiry || !car_plate || !sacco || !profile || !badge) {
      return log("FRONTEND ERROR:\nOne or more fields are empty", "red");
    }

    const fd = new FormData();
    fd.append("full_name", full_name);
    fd.append("email", email);
    fd.append("password", password);
    fd.append("psv_expiry", psv_expiry);
    fd.append("car_plate", car_plate);
    fd.append("sacco", sacco);
    fd.append("profile_photo", profile);
    fd.append("psv_badge", badge);

    const res = await fetch(BASE + "/signup", {
      method: "POST",
      body: fd
    });

    const data = await res.json();

    if (!res.ok) {
      let errorText = "BACKEND ERROR:\n";
      errorText += JSON.stringify(data, null, 2);
      return log(errorText, "red");
    }

    log("SUCCESS:\n" + JSON.stringify(data, null, 2), "lime");

  } catch (err) {
    log("FRONTEND EXCEPTION:\n" + err.message, "red");
  }
}
</script>

</body>
</html>
