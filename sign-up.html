<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<title>Register</title>

<style>
/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* BODY */
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  padding-bottom: 150px; /* space so footer doesn't overlap form */
}

/* HEADER */
header {
  width: 100%;
  height: 70px;
  background: #2f4f4f;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 20px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  position: relative;
  z-index: 1001;
}

.logo {
  display: flex;
  align-items: center;
}

.logo svg {
  width: 40px;
  height: 40px;
  fill: goldenrod;
}

.logo span {
  color: goldenrod;
  font-size: 1.5rem;
  margin-left: 10px;
  font-weight: bold;
}

nav {
  display: flex;
  gap: 30px;
}

nav a {
  text-decoration: none;
  color: white;
  font-size: 1rem;
  transition: color 0.3s;
}

nav a:hover {
  color: goldenrod;
}

/* MOBILE MENU BUTTON */
.menu-icon {
  display: none;
  flex-direction: column;
  justify-content: center;
  cursor: pointer;
  gap: 5px;
}

.menu-icon span {
  display: block;
  height: 3px;
  background: white;
  border-radius: 2px;
  transition: all 0.4s ease;
}

/* MOBILE MENU */
.mobile-nav {
  position: fixed;
  top: 0;
  right: -250px;
  width: 250px;
  height: 50%;
  background: white;
  display: flex;
  flex-direction: column;
  padding: 80px 20px;
  box-shadow: -2px 0 5px rgba(0,0,0,0.2);
  transition: right 0.4s ease;
  z-index: 1000;
}

.mobile-nav a {
  text-decoration: none;
  color: #2f4f4f;
  font-size: 1.2rem;
  margin-bottom: 20px;
}

.overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.4);
  display: none;
  z-index: 8;
}

/* RESPONSIVE TOP NAV */
@media (max-width: 768px) {
  nav {
    display: none;
  }
  .menu-icon {
    display: flex;
  }
}

/* BOTTOM FOOTER */
.bottom-nav {
  width: 100%;
  background: #2f4f4f;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 15px 10px;
  position: fixed;
  bottom: 0;
  left: 0;
  z-index: 1001;
}

.bottom-menu {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  margin-bottom: 15px;
}

.bottom-menu a {
  text-decoration: none;
  color: white;
  font-size: 1rem;
  transition: color 0.3s;
}

.bottom-menu a:hover {
  color: goldenrod;
}

/* SOCIAL ICONS */
.social-icons {
  display: flex;
  gap: 20px;
  justify-content: center;
  margin-bottom: 10px;
}

.social-icons a {
  color: white;
}

.social-icons i {
  font-size: 26px;
  transition: color 0.3s;
}

.social-icons i:hover {
  color: goldenrod;
}

/* HIDE BOTTOM MENU ON MOBILE */
@media (max-width: 768px) {
  .bottom-menu {
    display: none;
  }
}

/* COPYRIGHT */
.copyright {
  font-size: 0.8rem;
  color: #ccc;
  text-align: center;
}

/* ========================= */
/* YOUR REGISTER FORM CSS    */
/* ========================= */

.container {
  max-width: 500px;
  margin: 40px auto;
  padding: 20px;
  box-sizing: border-box;
}

input, select {
  display:block;
  width:100%;
  padding:10px;
  margin:10px 0;
  font-size: 16px;
}

button {
  padding:10px 20px;
  width:100%;
  font-size: 16px;
}

#errorBox {
  color:red;
  margin-top:10px;
  white-space:pre-line;
}

#successBox {
  color:green;
  margin-top:10px;
}

.password-wrapper {
  position: relative;
  width: 100%;
}

.toggle-eye {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  cursor: pointer;
  user-select: none;
  font-size: 18px;
}
</style>
</head>

<body>

<!-- ====================== -->
<!-- HEADER -->
<!-- ====================== -->
<header>
  <div class="logo">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
      <path d="M3 4h18v16H3V4zm2 2v12h14V6H5zm2 2h10v8H7V8z"/>
    </svg>
    <span>Hati Safi</span>
  </div>

  <nav>
    <a href="#">Submit</a>
    <a href="#">About Us</a>
    <a href="#">FAQ</a>
    <a href="#">Contact Us</a>
    <a href="#">Testimonials</a>
  </nav>

  <div class="menu-icon" id="menu-icon">
    <span style="width: 20px;"></span>
    <span style="width: 30px;"></span>
  </div>
</header>

<div class="mobile-nav" id="mobile-nav">
  <a href="#">Submit</a>
  <a href="#">About Us</a>
  <a href="#">FAQ</a>
  <a href="#">Contact Us</a>
  <a href="#">Testimonials</a>
</div>

<div class="overlay" id="overlay"></div>


<!-- ====================== -->
<!-- YOUR REGISTRATION FORM -->
<!-- ====================== -->
<div class="container">
  <h2>Create Account</h2>

  <input id="name" placeholder="Enter full name" />
  <input id="email" placeholder="Enter email" />

  <input id="phone_number" placeholder="Enter phone number (+2547...)" />

  <select id="sacco">
    <option value="">Select Sacco</option>
    <option value="OOD">OOD</option>
    <option value="DOD">DOD</option>
    <option value="NONE">NONE</option>
  </select>

  <div class="password-wrapper">
    <input id="password" type="password" placeholder="Enter password" />
    <span class="toggle-eye">👁️</span>
  </div>

  <div class="password-wrapper">
    <input id="confirm" type="password" placeholder="Confirm password" />
    <span class="toggle-eye">👁️</span>
  </div>

  <button>Submit</button>

  <div id="errorBox"></div>
  <div id="successBox"></div>
</div>


<!-- ====================== -->
<!-- FOOTER -->
<!-- ====================== -->
<div class="bottom-nav">
  <div class="bottom-menu">
    <a href="#">Submit</a>
    <a href="#">About Us</a>
    <a href="#">FAQ</a>
    <a href="#">Contact Us</a>
    <a href="#">Testimonials</a>
  </div>

  <div class="social-icons">
    <a href="#"><i class="fab fa-facebook-f"></i></a>
    <a href="#"><i class="fab fa-twitter"></i></a>
    <a href="#"><i class="fab fa-instagram"></i></a>
    <a href="#"><i class="fab fa-linkedin-in"></i></a>
  </div>

  <div class="copyright">
    &copy; 2025 Hati Safi. All Rights Reserved.
  </div>
</div>


<script>
function togglePassword(id, el) {
  const input = document.getElementById(id);
  if (input.type === "password") {
    input.type = "text";
    el.textContent = "🙈";
  } else {
    input.type = "password";
    el.textContent = "👁️";
  }
}

function validateFrontend(name, email, phone, sacco, password, confirm) {
  let errors = [];

  if (!name) errors.push("Name is required.");

  // EMAIL
  if (!email) {
    errors.push("Email is required.");
  } else {
    const emailRegex = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;
    if (!emailRegex.test(email)) {
      errors.push("Enter a valid email address.");
    }
  }

  // PHONE NUMBER (+254XXXXXXXXX)
  const phoneRegex = /^\+254\d{9}$/;
  if (!phoneRegex.test(phone)) {
    errors.push("Phone must be in +254XXXXXXXXX format.");
  }

  // SACCO
  if (!sacco) {
    errors.push("Please select a sacco.");
  }

  // PASSWORD RULES
  if (password.length < 8) errors.push("Password must be at least 8 characters.");
  if (!/[A-Z]/.test(password)) errors.push("At least one capital letter required.");
  if (!/[a-z]/.test(password)) errors.push("At least one lowercase letter required.");
  if (!/[0-9]/.test(password)) errors.push("At least one number required.");
  if (!/[!@#$%^&*(),.?\":{}|<>]/.test(password)) errors.push("At least one special character required.");

  if (password !== confirm) errors.push("Passwords do not match.");

  return errors;
}

async function registerUser() {
  document.getElementById("errorBox").textContent = "";
  document.getElementById("successBox").textContent = "";

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim().toLowerCase();
  const phone_number = document.getElementById("phone_number").value.trim();
  const sacco = document.getElementById("sacco").value;
  const password = document.getElementById("password").value;
  const confirm = document.getElementById("confirm").value;

  // FRONTEND VALIDATION
  const errors = validateFrontend(name, email, phone_number, sacco, password, confirm);
  if (errors.length > 0) {
    document.getElementById("errorBox").textContent = errors.join("\n");
    return;
  }

  // STEP 1 — REGISTER
  let regData;
  try {
    const res = await fetch("https://drivers-backend-4spp.onrender.com/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, email, phone_number, sacco, password, confirm })
    });

    regData = await res.json();
  } catch (err) {
    document.getElementById("errorBox").textContent = "Network error during registration: " + err;
    return;
  }

  if (!regData.success) {
    document.getElementById("errorBox").textContent = regData.error;
    return;
  }

  // STEP 2 — SEND CONTINUE REG EMAIL
  let contData;
  try {
    const res2 = await fetch("https://drivers-backend-4spp.onrender.com/continue-reg", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email })
    });

    contData = await res2.json();
  } catch (err) {
    document.getElementById("errorBox").textContent = "Network error sending email: " + err;
    return;
  }

  if (!contData.success) {
    document.getElementById("errorBox").textContent = contData.error;
    return;
  }

  document.getElementById("successBox").textContent =
    "Registration complete! Check your email to continue ✔";
}

  const menuIcon = document.getElementById('menu-icon');  
  const mobileNav = document.getElementById('mobile-nav');  
  const overlay = document.getElementById('overlay');  
  
  let menuOpen = false;  
  
  menuIcon.addEventListener('click', () => {  
    menuOpen = !menuOpen;  
    if (menuOpen) {  
      mobileNav.style.right = '0';  
      overlay.style.display = 'block';  
      // Change to X  
      menuIcon.innerHTML = `  
        <span style="transform: rotate(45deg) translate(5px, 5px); width: 30px;"></span>  
        <span style="transform: rotate(-45deg) translate(5px, -5px); width: 30px;"></span>  
      `;  
    } else {  
      closeMenu();  
    }  
  });  
  
  overlay.addEventListener('click', closeMenu);  
  
  function closeMenu() {  
    mobileNav.style.right = '-250px';  
    overlay.style.display = 'none';  
    menuOpen = false;  
    // Change back to two uneven lines  
    menuIcon.innerHTML = `  
      <span style="width: 20px;"></span>  
      <span style="width: 30px;"></span>  
    `;  
  }  
  
</script>

</body>
</html>
