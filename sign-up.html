<!DOCTYPE html>
<html>
<head>

  
  <title>Register</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body { font-family: sans-serif; padding: 20px; }
    input, select { display:block; width:100%; padding:10px; margin:10px 0; }
    button { padding:10px 20px; width:100%; }
    #errorBox { color:red; margin-top:10px; white-space:pre-line; }
    #successBox { color:green; margin-top:10px; }

    .password-wrapper {
      position: relative;
      width: 100%;
    }

    .toggle-eye {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      user-select: none;
      font-size: 18px;
    }

    /* HEADER */
header {
  width: 100%;
  background: #2f4f4f;
  height: 70px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 20px;
  color: white;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  position: fixed;
  top: 0;
  left: 0;
  z-index: 2000;
}
.logo { display: flex; align-items: center; }
.logo svg { width: 40px; height: 40px; fill: goldenrod; }
.logo span { font-size: 1.6rem; margin-left: 10px; color: goldenrod; font-weight: bold; }
nav { display: flex; gap: 30px; }
nav a { color: white; text-decoration: none; transition: 0.3s; }
nav a:hover { color: goldenrod; }

/* MOBILE MENU BUTTON */
.menu-icon { display: none; flex-direction: column; gap: 6px; cursor: pointer; }
.menu-icon span { height: 3px; width: 28px; background: white; border-radius: 3px; }

/* MOBILE NAVIGATION */
.mobile-nav {
  position: fixed;
  right: -260px;
  top: 0;
  width: 260px;
  height: 100%;
  background: white;
  padding: 100px 20px;
  box-shadow: -2px 0 10px rgba(0,0,0,0.15);
  display: flex;
  flex-direction: column;
  gap: 25px;
  transition: 0.4s ease;
  z-index: 1500;
}
.mobile-nav a { color: #2f4f4f; font-size: 1.2rem; text-decoration: none; }

/* OVERLAY */
#overlay {
  position: fixed;
  display: none;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.4);
  z-index: 1000;
}

/* FOOTER */
.bottom-nav {
  width: 100%;
  background: #2f4f4f;
  color: white;
  padding: 20px 10px;
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 15px;
  position: fixed;
  bottom: 0; left: 0;
  z-index: 2000;
}
.bottom-menu { display: flex; justify-content: center; gap: 25px; flex-wrap: wrap; }
.bottom-menu a { color: white; text-decoration: none; }
.bottom-menu a:hover { color: goldenrod; }
.social-icons { display: flex; justify-content: center; gap: 20px; }
.social-icons i { font-size: 26px; transition: .3s; }
.social-icons i:hover { color: goldenrod; }
  </style>
</head>
<body>
<!-- HEADER -->
<header>
  <div class="logo">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
      <path d="M3 4h18v16H3V4zm2 2v12h14V6H5zm2 2h10v8H7V8z"/>
    </svg>
    <span>Hati Safi</span>
  </div>

  <nav>
    <a href="#">Submit</a>
    <a href="#">About Us</a>
    <a href="#">FAQ</a>
    <a href="#">Contact Us</a>
    <a href="#">Testimonials</a>
  </nav>

  <div class="menu-icon" id="menu-icon">
    <span></span>
    <span></span>
  </div>
</header>

<div class="mobile-nav" id="mobile-nav">
  <a href="#">Submit</a>
  <a href="#">About Us</a>
  <a href="#">FAQ</a>
  <a href="#">Contact Us</a>
  <a href="#">Testimonials</a>
</div>

<div id="overlay"></div>
  <h2>Create Account</h2>

  <input id="name" placeholder="Enter full name" />
  <input id="email" placeholder="Enter email" />

  <!-- PHONE NUMBER -->
  <input id="phone_number" placeholder="Enter phone number (+2547...)" />

  <!-- SACCO -->
  <select id="sacco">
    <option value="">Select Sacco</option>
    <option value="OOD">OOD</option>
    <option value="DOD">DOD</option>
    <option value="NONE">NONE</option>
  </select>

  <!-- PASSWORD WITH EYE -->
  <div class="password-wrapper">
    <input id="password" type="password" placeholder="Enter password" />
    <span class="toggle-eye" onclick="togglePassword('password', this)">👁️</span>
  </div>

  <!-- CONFIRM PASSWORD WITH EYE -->
  <div class="password-wrapper">
    <input id="confirm" type="password" placeholder="Confirm password" />
    <span class="toggle-eye" onclick="togglePassword('confirm', this)">👁️</span>
  </div>

  <button onclick="registerUser()">Submit</button>

  <div id="errorBox"></div>
  <div id="successBox"></div>

<!-- FOOTER -->
<div class="bottom-nav">
  <div class="bottom-menu">
    <a href="#">Submit</a>
    <a href="#">About Us</a>
    <a href="#">FAQ</a>
    <a href="#">Contact Us</a>
    <a href="#">Testimonials</a>
  </div>

  <div class="social-icons">
    <a href="#"><i class="fab fa-facebook-f"></i></a>
    <a href="#"><i class="fab fa-twitter"></i></a>
    <a href="#"><i class="fab fa-instagram"></i></a>
    <a href="#"><i class="fab fa-linkedin-in"></i></a>
  </div>

  <div class="copyright">
    © 2025 Hati Safi. All Rights Reserved.
  </div>
</div>
  
<script>
function togglePassword(id, el) {
  const input = document.getElementById(id);
  if (input.type === "password") {
    input.type = "text";
    el.textContent = "🙈";
  } else {
    input.type = "password";
    el.textContent = "👁️";
  }
}

function validateFrontend(name, email, phone, sacco, password, confirm) {
  let errors = [];

  if (!name) errors.push("Name is required.");

  // EMAIL
  if (!email) {
    errors.push("Email is required.");
  } else {
    const emailRegex = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;
    if (!emailRegex.test(email)) {
      errors.push("Enter a valid email address.");
    }
  }

  // PHONE NUMBER (+254XXXXXXXXX)
  const phoneRegex = /^\+254\d{9}$/;
  if (!phoneRegex.test(phone)) {
    errors.push("Phone must be in +254XXXXXXXXX format.");
  }

  // SACCO
  if (!sacco) {
    errors.push("Please select a sacco.");
  }

  // PASSWORD RULES
  if (password.length < 8) errors.push("Password must be at least 8 characters.");
  if (!/[A-Z]/.test(password)) errors.push("At least one capital letter required.");
  if (!/[a-z]/.test(password)) errors.push("At least one lowercase letter required.");
  if (!/[0-9]/.test(password)) errors.push("At least one number required.");
  if (!/[!@#$%^&*(),.?\":{}|<>]/.test(password)) errors.push("At least one special character required.");

  if (password !== confirm) errors.push("Passwords do not match.");

  return errors;
}

async function registerUser() {
  document.getElementById("errorBox").textContent = "";
  document.getElementById("successBox").textContent = "";

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim().toLowerCase();
  const phone_number = document.getElementById("phone_number").value.trim();
  const sacco = document.getElementById("sacco").value;
  const password = document.getElementById("password").value;
  const confirm = document.getElementById("confirm").value;

  // FRONTEND VALIDATION
  const errors = validateFrontend(name, email, phone_number, sacco, password, confirm);
  if (errors.length > 0) {
    document.getElementById("errorBox").textContent = errors.join("\n");
    return;
  }

  // STEP 1 — REGISTER
  let regData;
  try {
    const res = await fetch("https://drivers-backend-4spp.onrender.com/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, email, phone_number, sacco, password, confirm })
    });

    regData = await res.json();
  } catch (err) {
    document.getElementById("errorBox").textContent = "Network error during registration: " + err;
    return;
  }

  if (!regData.success) {
    document.getElementById("errorBox").textContent = regData.error;
    return;
  }

  // STEP 2 — SEND CONTINUE REG EMAIL
  let contData;
  try {
    const res2 = await fetch("https://drivers-backend-4spp.onrender.com/continue-reg", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email })
    });

    contData = await res2.json();
  } catch (err) {
    document.getElementById("errorBox").textContent = "Network error sending email: " + err;
    return;
  }

  if (!contData.success) {
    document.getElementById("errorBox").textContent = contData.error;
    return;
  }

  document.getElementById("successBox").textContent =
    "Registration complete! Check your email to continue ✔";
}


const menuIcon = document.getElementById("menu-icon");
const mobileNav = document.getElementById("mobile-nav");
const overlay = document.getElementById("overlay");

let menuOpen = false;
menuIcon.addEventListener("click", () => {
    menuOpen = !menuOpen;
    if(menuOpen){
        mobileNav.style.right = "0";
        overlay.style.display = "block";
        menuIcon.innerHTML = `<span style="transform: rotate(45deg);"></span><span style="transform: rotate(-45deg); position: relative; top:-3px;"></span>`;
    } else { closeMenu(); }
});
overlay.addEventListener("click", closeMenu);
function closeMenu(){
    mobileNav.style.right = "-260px";
    overlay.style.display = "none";
    menuOpen = false;
    menuIcon.innerHTML = `<span></span><span></span>`;
  }
  
</script>

</body>
</html>
