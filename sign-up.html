<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D4D Driver Signup</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="logo">D4D</div>
    <button id="hamburger" class="hamburger">☰</button>
  </header>

  <!-- MOBILE MENU -->
  <nav id="mobileMenu" class="mobile-menu hidden">
    <a href="#">Home</a>
    <a href="#">Login</a>
    <a href="#">Support</a>
  </nav>

  <!-- SIGNUP FORM -->
  <section class="container">
    <h2>Create Driver Account</h2>

    <form id="signupForm">

      <label>Full Name</label>
      <input type="text" id="fullname" required>

      <label>Email</label>
      <input type="email" id="email" required>

      <label>Phone (+254xxxxxxxxx)</label>
      <input type="text" id="phone" pattern="^\+254\d{9}$" required>

      <label>Password</label>
      <div class="password-wrap">
        <input type="password" id="password" required>
        <span class="toggle" id="togglePass">👁</span>
      </div>

      <label>Confirm Password</label>
      <div class="password-wrap">
        <input type="password" id="confirmPassword" required>
        <span class="toggle" id="toggleConfirm">👁</span>
      </div>

      <p id="passwordError" class="error"></p>

      <button type="submit" class="btn">Sign Up</button>
    </form>

    <p id="result" class="result"></p>
  </section>

  <script src="script.js"></script>
</body>
</html>
