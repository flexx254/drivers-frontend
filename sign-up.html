<!DOCTYPE html>
<html>
<head>
  <title>Register</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    input { display:block; width:100%; padding:10px; margin:10px 0; }
    button { padding:10px 20px; }
    #errorBox { color:red; margin-top:10px; }
    #successBox { color:green; margin-top:10px; }
    #nextStep { display:none; margin-top:20px; }
  </style>
</head>
<body>

  <h2>Create Account</h2>

  <input id="name" placeholder="Enter name" />

  <input id="password" type="password" placeholder="Enter password" />

  <input id="confirm" type="password" placeholder="Confirm password" />

  <button onclick="registerUser()">Submit</button>

  <div id="errorBox"></div>
  <div id="successBox"></div>

  <button id="nextStep">Next Step</button>

<script>
async function registerUser() {
  document.getElementById("errorBox").textContent = "";
  document.getElementById("successBox").textContent = "";

  const name = document.getElementById("name").value.trim();
  const password = document.getElementById("password").value;
  const confirm = document.getElementById("confirm").value;

  try {
    const res = await fetch("https://drivers-backend-4spp.onrender.com/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, password, confirm })
    });

    const data = await res.json();

    if (!data.success) {
      document.getElementById("errorBox").textContent = data.error;
      return;
    }

    // Success
    document.getElementById("successBox").textContent =
      "You have partly registered successfully ✔";

    document.getElementById("nextStep").style.display = "block";

  } catch(err) {
    document.getElementById("errorBox").textContent = "Network error: " + err;
  }
}
</script>

</body>
</html>
