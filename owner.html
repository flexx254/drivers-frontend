

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Owner Details</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root {
  --main-green: #1b8f2a;
  --white: #ffffff;
  --danger: #a30000;
}

body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f5f5f5;
}

/* HEADER */
header {
  background-color: var(--main-green);
  color: var(--white);
  padding: 15px 20px;
  display: flex;
  align-items: center;
}

header img {
  height: 32px;
}

/* FORM CONTAINER */
.container {
  max-width: 500px;
  margin: 20px auto;
  background: white;
  padding: 22px;
  border-radius: 10px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.12);
}

h2 {
  color: var(--main-green);
  text-align: center;
  margin-bottom: 20px;
}

label {
  font-weight: bold;
  color: var(--main-green);
  display: block;
  margin-bottom: 6px;
}

input {
  width: 100%;
  padding: 12px;
  border: 2px solid var(--main-green);
  border-radius: 8px;
  font-size: 16px;
  margin-bottom: 16px;
}

/* BUTTON */
button {
  width: 100%;
  background: var(--main-green);
  color: white;
  padding: 14px;
  border: none;
  border-radius: 8px;
  font-size: 18px;
  cursor: pointer;
}

button:active {
  background: #166d20;
}

/* PREVIEW */
img.preview {
  width: 120px;
  height: 120px;
  object-fit: cover;
  display: none;
  margin-bottom: 15px;
  border: 2px solid var(--main-green);
  border-radius: 8px;
}

/* MESSAGE */
.msg {
  display: none;
  padding: 12px;
  margin-top: 15px;
  border-radius: 8px;
  font-size: 15px;
}

.success {
  background: #d8ffd8;
  color: #0f6e12;
}

.error {
  background: #ffd6d6;
  color: var(--danger);
}

/* FOOTER */
footer {
  background-color: var(--main-green);
  color: white;
  text-align: center;
  padding: 15px;
  margin-top: 30px;
}
</style>
</head>

<body>

<header>
  <img src="assets/logo/d4d-logo.png" alt="D4D Logo">
</header>

<div class="container">

<h2>Car Owner Details</h2>

<form id="ownerForm" enctype="multipart/form-data">

<label>Car Number Plate</label>
<input type="text" id="car_plate" name="number_plate" placeholder="e.g. KDK 123A">

<label>Car Make</label>
<input type="text" id="car_make" name="car_make" placeholder="e.g. Toyota">

<label>Car Model</label>
<input type="text" id="car_model" name="car_model" placeholder="e.g. Vitz">

<!-- IMAGE UPLOADS -->
<label>Upload Car Image</label>
<img id="car_preview" class="preview">
<input type="file" id="car_image" name="car_image" accept="image/*">

<label>Upload Logbook</label>
<img id="logbook_preview" class="preview">
<input type="file" id="logbook" name="logbook" accept="image/*,application/pdf">

<label>Upload Inspection Report</label>
<img id="inspection_preview" class="preview">
<input type="file" id="inspection_report" name="inspection_report" accept="image/*,application/pdf">

<label>Upload Uber Report <small>(Optional)</small></label>
<img id="uber_preview" class="preview">
<input type="file" id="uber_report" name="uber_report" accept="image/*,application/pdf">

<button type="button" onclick="saveCarOwnerDetails()">Save Car Owner Details</button>

<div id="msgBox" class="msg"></div>

</form>
</div>

<footer>
&copy; 2025 D4D – Drivers for Drivers
</footer>

<script>
/* ---------------- ELEMENT REFERENCES ---------------- */
const car_plate = document.getElementById("car_plate");
const car_make = document.getElementById("car_make");
const car_model = document.getElementById("car_model");

const car_image = document.getElementById("car_image");
const logbook = document.getElementById("logbook");
const inspection_report = document.getElementById("inspection_report");
const uber_report = document.getElementById("uber_report");

const msgBox = document.getElementById("msgBox");

/* ---------------- MESSAGE HANDLER ---------------- */
function showMessage(text, type){
  msgBox.textContent = text;
  msgBox.className = "msg " + type;
  msgBox.style.display = "block";
}

/* ---------------- IMAGE PREVIEW ---------------- */
function setupPreview(inputId, previewId){
  document.getElementById(inputId).addEventListener("change", function(){
    if(this.files[0] && this.files[0].type.startsWith("image/")){
      const img = document.getElementById(previewId);
      img.src = URL.createObjectURL(this.files[0]);
      img.style.display = "block";
    }
  });
}

setupPreview("car_image","car_preview");
setupPreview("logbook","logbook_preview");
setupPreview("inspection_report","inspection_preview");
setupPreview("uber_report","uber_preview");

/* ---------------- FORM SUBMISSION ---------------- */
async function saveCarOwnerDetails(){

  if(
    !car_plate.value.trim() ||
    !car_make.value.trim() ||
    !car_model.value.trim() ||
    !car_image.files[0] ||
    !logbook.files[0] ||
    !inspection_report.files[0]
  ){
    showMessage("Please fill all required fields and upload documents.","error");
    return;
  }

  const formData = new FormData();
  formData.append("number_plate", car_plate.value.trim());
  formData.append("car_make", car_make.value.trim());
  formData.append("car_model", car_model.value.trim());
  formData.append("car_image", car_image.files[0]);
  formData.append("logbook", logbook.files[0]);
  formData.append("inspection_report", inspection_report.files[0]);

  if(uber_report.files[0]) {
    formData.append("uber_report", uber_report.files[0]);
  }

  try{
    showMessage("Submitting details...","success");

    const res = await fetch(
      "https://drivers-backend-4spp.onrender.com/register-owner",
      {
        method: "POST",
        body: formData
      }
    );

    const data = await res.json();

    if(!res.ok){
      showMessage(data.error || "Submission failed.","error");
      return;
    }

    showMessage("Car owner registered successfully.","success");

  }catch(err){
    showMessage("Network error. Please try again.","error");
  }
}
</script>

</body>
  </html>
