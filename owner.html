<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Owner Details</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root {
  --main-green: #1b8f2a;
  --white: #ffffff;
}

body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f5f5f5;
}

/* HEADER */
header {
  background-color: var(--main-green);
  color: var(--white);
  padding: 15px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header img {
  height: 32px;
}

/* FORM CONTAINER */
.container {
  max-width: 500px;
  margin: 20px auto;
  background: white;
  padding: 22px;
  border-radius: 10px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.12);
}

h2 {
  color: var(--main-green);
  text-align: center;
  margin-bottom: 20px;
}

label {
  font-weight: bold;
  color: var(--main-green);
  display: block;
  margin-bottom: 6px;
}

input {
  width: 100%;
  padding: 12px;
  border: 2px solid var(--main-green);
  border-radius: 8px;
  font-size: 16px;
  margin-bottom: 20px;
}

/* PASSWORD */
.password-wrapper {
  position: relative;
}

.password-wrapper input {
  padding-right: 42px;
}

.toggle-password {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  cursor: pointer;
  color: var(--main-green);
  font-size: 18px;
}

button {
  width: 100%;
  background: var(--main-green);
  color: white;
  padding: 14px;
  border: none;
  border-radius: 8px;
  font-size: 18px;
  cursor: pointer;
}

button:active {
  background: #166d20;
}

/* PREVIEW */
img.preview {
  width: 120px;
  height: 120px;
  object-fit: cover;
  display: none;
  margin-bottom: 15px;
  border: 2px solid var(--main-green);
  border-radius: 8px;
}

/* MESSAGE */
.msg {
  display: none;
  padding: 12px;
  margin-top: 15px;
  border-radius: 8px;
  font-size: 15px;
}

.success {
  background: #d8ffd8;
  color: #0f6e12;
}

.error {
  background: #ffd6d6;
  color: #a30000;
}

/* FOOTER */
footer {
  background-color: var(--main-green);
  color: white;
  text-align: center;
  padding: 15px;
  margin-top: 30px;
}
</style>
</head>

<body>

<header>
  <img src="assets/logo/d4d-logo.png" alt="D4D Logo">
</header>

<div class="container">
<h2>Car Owner Details</h2>

<label>Full Names</label>
<input type="text" id="owner_name">

<label>Phone Number</label>
<input type="tel" id="phone_number" placeholder="+2547XXXXXXXX">

<label>Car Number Plate</label>
<input type="text" id="car_plate">

<label>Car Make</label>
<input type="text" id="car_make">

<label>Car Model</label>
<input type="text" id="car_model">

<!-- PASSWORD -->
<label>Create Password</label>
<div class="password-wrapper">
  <input type="password" id="password" placeholder="Minimum 8 characters">
  <i class="fa-solid fa-eye toggle-password" onclick="togglePassword('password', this)"></i>
</div>

<label>Confirm Password</label>
<div class="password-wrapper">
  <input type="password" id="confirm_password">
  <i class="fa-solid fa-eye toggle-password" onclick="togglePassword('confirm_password', this)"></i>
</div>

<label>Upload Car Image</label>
<img id="car_preview" class="preview">
<input type="file" id="car_image" accept="image/*">

<label>Upload Logbook</label>
<img id="logbook_preview" class="preview">
<input type="file" id="logbook" accept="image/*,application/pdf">

<label>Upload Inspection Report</label>
<img id="inspection_preview" class="preview">
<input type="file" id="inspection_report" accept="image/*,application/pdf">

<label>Upload Uber Report <small>(Optional)</small></label>
<img id="uber_preview" class="preview">
<input type="file" id="uber_report" accept="image/*,application/pdf">

<button onclick="saveCarOwnerDetails()">Save Car Owner Details</button>

<div id="msgBox" class="msg"></div>
</div>

<footer>
  &copy; 2025 D4D – Drivers for Drivers
</footer>

<script>
function togglePassword(inputId, icon){
  const input = document.getElementById(inputId);
  if(input.type === "password"){
    input.type = "text";
    icon.classList.remove("fa-eye");
    icon.classList.add("fa-eye-slash");
  } else {
    input.type = "password";
    icon.classList.remove("fa-eye-slash");
    icon.classList.add("fa-eye");
  }
}

async function saveCarOwnerDetails(){

  const name = owner_name.value.trim();
  const phone = phone_number.value.trim();
  const plate = car_plate.value.trim();
  const make = car_make.value.trim();
  const model = car_model.value.trim();
  const password = password.value;
  const confirmPassword = confirm_password.value;

  const carImage = car_image.files[0];
  const logbookFile = logbook.files[0];
  const inspectionFile = inspection_report.files[0];
  const uberFile = uber_report.files[0];

  if(!name || !phone || !plate || !make || !model ||
     !password || !confirmPassword ||
     !carImage || !logbookFile || !inspectionFile){
    showMessage("Please fill all required fields.","error");
    return;
  }

  if(password.length < 8){
    showMessage("Password must be at least 8 characters.","error");
    return;
  }

  if(password !== confirmPassword){
    showMessage("Passwords do not match.","error");
    return;
  }

  const formData = new FormData();
  formData.append("full_name", name);
  formData.append("phone_number", phone);
  formData.append("number_plate", plate);
  formData.append("car_make", make);
  formData.append("car_model", model);
  formData.append("password", password);
  formData.append("confirm_password", confirmPassword);
  formData.append("car_image", carImage);
  formData.append("logbook", logbookFile);
  formData.append("inspection_report", inspectionFile);
  if(uberFile) formData.append("uber_report", uberFile);

  try {
    showMessage("Uploading details, please wait...","success");

    const res = await fetch(
      "https://drivers-backend-4spp.onrender.com/register-owner",
      { method: "POST", body: formData }
    );

    const data = await res.json();

    if(!res.ok){
      showMessage(data.error || "Submission failed.","error");
      return;
    }

    showMessage("Car owner registered successfully.","success");

  } catch {
    showMessage("Network error. Please try again.","error");
  }
}

function showMessage(text, type){
  msgBox.textContent = text;
  msgBox.className = "msg " + type;
  msgBox.style.display = "block";
}

function setupPreview(inputId, previewId){
  document.getElementById(inputId).addEventListener("change", function(){
    const preview = document.getElementById(previewId);
    if(this.files[0]?.type.startsWith("image/")){
      preview.src = URL.createObjectURL(this.files[0]);
      preview.style.display = "block";
    }
  });
}

setupPreview("car_image","car_preview");
setupPreview("logbook","logbook_preview");
setupPreview("inspection_report","inspection_preview");
setupPreview("uber_report","uber_preview");
</script>

</body>
</html>
