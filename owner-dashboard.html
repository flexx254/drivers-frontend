<!DOCTYPE html>  <html lang="en">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<title>Owner Dashboard</title>  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">  <style>  
:root {  
  --main-green:#1b8f2a;  
  --white:#fff;  
}  
  
body { margin:0; font-family:Arial,sans-serif; background:#f5f5f5; }  
  
/* HEADER */  
header {  
  background:var(--main-green);  
  color:var(--white);  
  padding:15px 20px;  
  display:flex;  
  justify-content:space-between;  
  align-items:center;  
}  
  
header img { height:32px; }  
  
.menu-icon { display:none; font-size:24px; cursor:pointer; }  
  
nav { display:flex; gap:20px; }  
nav a { color:white; text-decoration:none; }  
  
nav.active {  
  display:block;  
  position:absolute;  
  top:60px;  
  right:20px;  
  background:var(--main-green);  
  padding:15px;  
  border-radius:6px;  
}  
  
@media(max-width:768px){  
  nav{display:none; flex-direction:column;}  
  .menu-icon{display:block;}  
}  
  
/* MAIN */  
.container {  
  max-width:600px;  
  margin:20px auto;  
  background:white;  
  padding:22px;  
  border-radius:10px;  
  box-shadow:0 3px 10px rgba(0,0,0,.12);  
}  
  
h2 { color:var(--main-green); text-align:center; }  
  
/* OWNER CARD */  
.owner-card {  
  display:flex;  
  gap:15px;  
  align-items:center;  
  padding:12px;  
  border:1px solid var(--main-green);  
  border-radius:8px;  
  background:#f9f9f9;  
  margin-top:15px;  
}  
  
.owner-card img {  
  width:60px;  
  height:60px;  
  border-radius:50%;  
  object-fit:cover;  
  border:2px solid var(--main-green);  
}  
  
.owner-info { flex:1; }  
.location { color:var(--main-green); font-weight:bold; }  
  
.connect-btn {  
  background:var(--main-green);  
  color:white;  
  border:none;  
  padding:8px 12px;  
  border-radius:6px;  
  cursor:pointer;  
}  
  
.phone {  
  margin-top:6px;  
  font-weight:bold;  
  display:none;  
}  
  
/* FOOTER */  
footer {  
  background:var(--main-green);  
  color:white;  
  text-align:center;  
  padding:15px;  
  margin-top:40px;  
}  

  .status-box{
  text-align:center;
  padding:12px;
  border-radius:8px;
  font-weight:bold;
  margin-bottom:15px;
}

.status-complete{
  background:#e6f7ea;
  color:var(--main-green);
  border:1px solid var(--main-green);
}

.status-incomplete{
  background:#ffe6e6;
  color:red;
  border:1px solid red;
}

.status-incomplete a{
  color:red;
  text-decoration:none;
  font-weight:bold;
}

 /* Driver login link (green) */
.driver-login-link{
  display:block;
  margin-top:8px;
  color:var(--main-green) !important;
  text-decoration:none;
  font-weight:bold;
} 

  /* CONTRACT CARD */
.contract-card{
  border:1px solid var(--main-green);
  border-radius:8px;
  padding:12px;
  margin-top:12px;
  background:#f0fff4;
}

.contract-status{
  font-weight:bold;
  margin-top:6px;
}

.status-green{
  color:green;
}

.status-red{
  color:red;
}

.terminate-btn{
  margin-top:8px;
  background:red;
  color:white;
  border:none;
  padding:6px 10px;
  border-radius:6px;
  cursor:pointer;
  }


  .request-card{
  display:flex;
  align-items:center;
  gap:15px;
  margin-top:15px;
  padding:12px;
  border:1px solid var(--main-green);
  border-radius:8px;
  background:#f9f9f9;
}

.request-card img{
  width:70px;
  height:70px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid var(--main-green);
}

.request-info{
  flex:1;
}

.request-location{
  color:var(--main-green);
  font-weight:bold;
  margin-top:4px;
}

.request-phone{
  margin-top:4px;
}

.request-status{
  margin-top:6px;
  font-weight:bold;
}

.status-pending{
  color:orange;
}

.status-approved{
  color:green;
}

.status-rejected{
  color:red;
}
</style>  </head>  <body>  <header>  
  <img src="assets/logo/d4d-logo.png" alt="D4D">  
  <div class="menu-icon" id="menuToggle"><i class="fas fa-bars"></i></div>  
  <nav id="navMenu">  
    <a href="#">Home</a>  
    <a href="#">Dashboard</a>  
    <a href="#">Logout</a>  
  </nav>  
</header>

  <div class="container">

  <div id="registrationStatus" class="status-box"></div>

  <!-- DRIVERS SECTION -->
  <hr style="margin:20px 0;">
  <h2>Available Drivers</h2>
  <div id="owners"></div>



  <!-- CONTRACTS SECTION -->
  <hr style="margin:25px 0;">
  <h2>Active Contracts</h2>
  <div id="contracts"></div>

  </div>
<footer>&copy; 2025 D4D Platform</footer>      
 <script>

/* ================= MENU ================= */
const menuToggle = document.getElementById("menuToggle");
const navMenu = document.getElementById("navMenu");

menuToggle.onclick = () => {
  navMenu.classList.toggle("active");
  menuToggle.innerHTML = navMenu.classList.contains("active")
    ? '<i class="fas fa-times"></i>'
    : '<i class="fas fa-bars"></i>';
};


/* ================= AUTH CHECK ================= */

const token = localStorage.getItem("token");

if (!token) {
  window.location.href = "partner-login.html";
}


/* ================= GLOBALS ================= */

const statusBox = document.getElementById("registrationStatus");
const ownersDiv = document.getElementById("owners");

let allDrivers = [];
let currentPage = 0;
const perPage = 4;


/* ================= REGISTRATION CHECK ================= */

async function checkRegistration() {
  try {
    const res = await fetch(
      "https://drivers-backend-4spp.onrender.com/check-partner-status",
      {
        headers: { "Authorization": "Bearer " + token }
      }
    );

    if (res.status === 401) {
      localStorage.removeItem("token");
      window.location.href = "partner-login.html";
      return false;
    }

    const data = await res.json();

    if (data.fully_registered) {
      statusBox.className = "status-box status-complete";
      statusBox.innerHTML = "✔ Fully Registered";
      return true;
    } else {
      statusBox.className = "status-box status-incomplete";
      statusBox.innerHTML = `
        ⚠ Not fully registered.<br>
        <a href="continue-partner-form.html">Complete registration</a>
        <a href="login.html" class="driver-login-link">Login as Driver</a>
      `;
      return false;
    }

  } catch {
    statusBox.className = "status-box status-incomplete";
    statusBox.innerHTML = `
      ⚠ Unable to verify registration.<br>
      <a href="continue-partner-form.html">Complete registration</a>
      <a href="login.html" class="driver-login-link">Login as Driver</a>
    `;
    return false;
  }
}


/* ================= LOAD DRIVERS ================= */

async function loadOwners() {
  try {
    const res = await fetch(
      "https://drivers-backend-4spp.onrender.com/owners-with-location",
      {
        headers: { "Authorization": "Bearer " + token }
      }
    );

    if (res.status === 401) {
      localStorage.removeItem("token");
      window.location.href = "partner-login.html";
      return;
    }

    const data = await res.json();

    if (!Array.isArray(data) || !data.length) {
      ownersDiv.innerHTML = "<p>No drivers available.</p>";
      return;
    }

    allDrivers = data;
    renderPage();

  } catch {
    ownersDiv.innerHTML = "<p>Error loading drivers.</p>";
  }
}


/* ================= RENDER PAGE ================= */

function renderPage() {
  ownersDiv.innerHTML = "";

  const start = currentPage * perPage;
  const end = start + perPage;

  const pageItems = allDrivers.slice(start, end);

  pageItems.forEach(driver => {
    const card = createDriverCard(driver);
    ownersDiv.appendChild(card);
  });

  renderPagination();
}


/* ================= DRIVER CARD ================= */

function createDriverCard(driver) {

  const card = document.createElement("div");
  card.className = "owner-card";

  card.innerHTML = `
    <img src="${driver.profile_pic_url}" alt="Profile">
    <div class="owner-info">
      <strong>${driver.full_name}</strong><br>
      <span class="location">${driver.location}</span>
      <div class="phone"></div>
    </div>
    <button class="connect-btn">Connect</button>
  `;

  const btn = card.querySelector(".connect-btn");
  const phoneEl = card.querySelector(".phone");

  btn.onclick = async () => {

    if (!confirm("Connect to this driver?")) return;

    btn.disabled = true;
    btn.textContent = "Connecting...";

    try {
      const connectRes = await fetch(
        "https://drivers-backend-4spp.onrender.com/connect-owner-secure",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
          },
          body: JSON.stringify({ driver_id: driver.id }) // ✅ FIXED
        }
      );

      const result = await connectRes.json();

      if (connectRes.ok) {
        phoneEl.textContent = result.phone_number;
        phoneEl.style.display = "block";
        btn.textContent = "Connected";

        showContractForm(card, driver); // ✅ NEW

      } else {
        alert(result.message || "Failed");
        btn.disabled = false;
        btn.textContent = "Connect";
      }

    } catch {
      alert("Network error");
      btn.disabled = false;
      btn.textContent = "Connect";
    }
  };

  return card;
}


/* ================= PAGINATION ================= */

function renderPagination() {
  const totalPages = Math.ceil(allDrivers.length / perPage);

  const nav = document.createElement("div");
  nav.style.textAlign = "center";
  nav.style.marginTop = "15px";

  nav.innerHTML = `
    <button ${currentPage === 0 ? "disabled" : ""}>⬅ Prev</button>
    <span style="margin:0 10px;">
      Page ${currentPage + 1} of ${totalPages}
    </span>
    <button ${currentPage >= totalPages - 1 ? "disabled" : ""}>Next ➡</button>
  `;

  const buttons = nav.querySelectorAll("button");

  buttons[0].onclick = () => {
    currentPage--;
    renderPage();
  };

  buttons[1].onclick = () => {
    currentPage++;
    renderPage();
  };

  ownersDiv.appendChild(nav);
}


/* ================= CONTRACT FORM ================= */

function showContractForm(card, driver) {

  const form = document.createElement("div");
  form.style.marginTop = "10px";

  form.innerHTML = `
    <hr>
    <h4 style="color:var(--main-green)">Create Contract</h4>

    <input type="number" placeholder="Daily amount (KES)" id="amount-${driver.id}" />

    <select id="days-${driver.id}">
      <option value="6">Mon–Sat</option>
      <option value="7">Mon–Sun</option>
    </select>

    <button class="connect-btn">Start Contract</button>
  `;

  const startBtn = form.querySelector("button");

  startBtn.onclick = async () => {

    const amount = document.getElementById(`amount-${driver.id}`).value;
    const days = document.getElementById(`days-${driver.id}`).value;

    if (!amount) {
      alert("Enter amount");
      return;
    }

    try {
      const res = await fetch(
        "https://drivers-backend-4spp.onrender.com/set-contract",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
          },
          body: JSON.stringify({
            driver_id: driver.id,
            daily_amount: Number(amount),
            work_days: Number(days)
          })
        }
      );

      const data = await res.json();

      if (res.ok) {
        form.innerHTML = `
          <p style="color:green;font-weight:bold;">
            Contract sent. Waiting for driver acceptance...
          </p>
        `;
      } else {
        alert(data.error || "Failed");
      }

    } catch {
      alert("Network error");
    }
  };

  card.appendChild(form);
}


/* ================= START APP ================= */

(async () => {
  const registered = await checkRegistration();

  if (registered) {
    loadOwners();
  } else {
    ownersDiv.innerHTML =
      "<p style='color:red;text-align:center'>Complete registration to continue.</p>";
  }
})();

   const contractsDiv = document.getElementById("contracts");
   const requestsDiv = document.getElementById("driverRequests");
async function loadContracts() {

  try {
    const res = await fetch(
      "https://drivers-backend-4spp.onrender.com/owner-contracts",
      {
        headers: {
          "Authorization": "Bearer " + token
        }
      }
    );

    const data = await res.json();

    if (!Array.isArray(data) || !data.length) {
      contractsDiv.innerHTML = "<p>No active contracts.</p>";
      return;
    }

    contractsDiv.innerHTML = "";

    data.forEach(contract => {

      const card = document.createElement("div");
      card.className = "contract-card";

      card.innerHTML = `
        <strong>Driver ID:</strong> ${contract.driver_id}<br>
        <strong>Daily:</strong> KES ${contract.daily_amount}<br>
        <strong>Status:</strong> ${contract.status}
        <div class="contract-status" id="status-${contract.id}">Checking...</div>
        <button class="terminate-btn">Terminate</button>
      `;

      checkPaymentStatus(contract.id);

      const btn = card.querySelector(".terminate-btn");

      btn.onclick = async () => {
        if (!confirm("Terminate contract?")) return;

        await fetch(
          "https://drivers-backend-4spp.onrender.com/terminate-contract",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": "Bearer " + token
            },
            body: JSON.stringify({ contract_id: contract.id })
          }
        );

        loadContracts();
      };

      contractsDiv.appendChild(card);
    });

  } catch {
    contractsDiv.innerHTML = "<p>Error loading contracts</p>";
  }
   }


   async function loadOwnerRequests() {

  requestsDiv.innerHTML = `
    <p>Loading requests...</p>
  `;

  try {

    const res = await fetch(
      "https://drivers-backend-4spp.onrender.com/owner-requests",
      {
        headers: {
          "Authorization": "Bearer " + token
        }
      }
    );

    if (res.status === 401) {
      localStorage.removeItem("token");
      window.location.href = "partner-login.html";
      return;
    }

    const data = await res.json();

    console.log("OWNER REQUESTS:", data);

    if (!data.success) {

      requestsDiv.innerHTML = `
        <p>No requests found.</p>
      `;

      return;
    }

    if (!Array.isArray(data.requests) || !data.requests.length) {

      requestsDiv.innerHTML = `
        <p>No driver requests.</p>
      `;

      return;
    }

    requestsDiv.innerHTML = "";

    data.requests.forEach(req => {

      let statusClass = "status-pending";

      if (req.status === "approved") {
        statusClass = "status-approved";
      }

      if (req.status === "rejected") {
        statusClass = "status-rejected";
      }

      const card = document.createElement("div");

      card.className = "request-card";

      card.innerHTML = `
        <img src="${req.profile_pic_url || 'https://via.placeholder.com/70'}">

        <div class="request-info">

          <strong>${req.full_name}</strong>

          <div class="request-location">
            ${req.location}
          </div>

          <div class="request-phone">
            ${req.phone_number || 'No phone'}
          </div>

          <div class="request-status ${statusClass}">
            ${req.status}
          </div>

        </div>
      `;

      requestsDiv.appendChild(card);

    });

  } catch (err) {

    console.log("REQUEST ERROR:", err);

    requestsDiv.innerHTML = `
      <p>Error loading requests.</p>
    `;
  }
   }


   async function checkPaymentStatus(contractId) {

  try {
    const res = await fetch(
      `https://drivers-backend-4spp.onrender.com/payment-status/${contractId}`
    );

    const data = await res.json();

    const el = document.getElementById(`status-${contractId}`);

    if (data.paid_today) {
      el.textContent = "✔ Paid Today";
      el.className = "contract-status status-green";
    } else {
      el.textContent = "❌ Not Paid Today";
      el.className = "contract-status status-red";
    }

  } catch {
    console.log("status error");
  }
   }

   (async () => {
  const registered = await checkRegistration();

  if (registered) {
    loadOwners();
    loadContracts(); 
    loadOwnerRequests();
  } else {
    ownersDiv.innerHTML =
      "<p style='color:red;text-align:center'>Complete registration to continue.</p>";
  }
})();

 </script>                 


</body>
