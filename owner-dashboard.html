 /* Driver login link (green) */

</style>  </head>  <body>  <header>  
  <img src="assets/logo/d4d-logo.png" alt="D4D">  
  <div class="menu-icon" id="menuToggle"><i class="fas fa-bars"></i></div>  
  <nav id="navMenu">  
    <a href="#">Home</a>  
    <a href="#">Dashboard</a>  
    <a href="#">Logout</a>  
  </nav>  
</header>

  <div class="container">

  <div id="registrationStatus" class="status-box"></div>

  <!-- DRIVERS SECTION -->
  <hr style="margin:20px 0;">
  <h2>Available Drivers</h2>
  <div id="owners"></div>



  <!-- CONTRACTS SECTION -->
  <hr style="margin:25px 0;">
  <h2>Active Contracts</h2>
  <div id="contracts"></div>

  </div>
<footer>&copy; 2025 D4D Platform</footer>      
 <script>

/* ================= MENU ================= */
const menuToggle = document.getElementById("menuToggle");
const navMenu = document.getElementById("navMenu");

menuToggle.onclick = () => {
  navMenu.classList.toggle("active");
  menuToggle.innerHTML = navMenu.classList.contains("active")
    ? '<i class="fas fa-times"></i>'
    : '<i class="fas fa-bars"></i>';
};


/* ================= AUTH CHECK ================= */

const token = localStorage.getItem("token");

if (!token) {
  window.location.href = "partner-login.html";
}


/* ================= GLOBALS ================= */

const statusBox = document.getElementById("registrationStatus");
const ownersDiv = document.getElementById("owners");

let allDrivers = [];
let currentPage = 0;
const perPage = 4;


/* ================= REGISTRATION CHECK ================= */

async function checkRegistration() {
  try {
    const res = await fetch(
      "https://drivers-backend-4spp.onrender.com/check-partner-status",
      {
        headers: { "Authorization": "Bearer " + token }
      }
    );

    if (res.status === 401) {
      localStorage.removeItem("token");
      window.location.href = "partner-login.html";
      return false;
    }

    const data = await res.json();

    if (data.fully_registered) {
      statusBox.className = "status-box status-complete";
      statusBox.innerHTML = "✔ Fully Registered";
      return true;
    } else {
      statusBox.className = "status-box status-incomplete";
      statusBox.innerHTML = `
        ⚠ Not fully registered.<br>
        <a href="continue-partner-form.html">Complete registration</a>
        <a href="login.html" class="driver-login-link">Login as Driver</a>
      `;
      return false;
    }

  } catch {
    statusBox.className = "status-box status-incomplete";
    statusBox.innerHTML = `
      ⚠ Unable to verify registration.<br>
      <a href="continue-partner-form.html">Complete registration</a>
      <a href="login.html" class="driver-login-link">Login as Driver</a>
    `;
    return false;
  }
}


/* ================= LOAD DRIVERS ================= */

async function loadOwners() {
  try {
    const res = await fetch(
      "https://drivers-backend-4spp.onrender.com/owners-with-location",
      {
        headers: { "Authorization": "Bearer " + token }
      }
    );

    if (res.status === 401) {
      localStorage.removeItem("token");
      window.location.href = "partner-login.html";
      return;
    }

    const data = await res.json();

    if (!Array.isArray(data) || !data.length) {
      ownersDiv.innerHTML = "<p>No drivers available.</p>";
      return;
    }

    allDrivers = data;
    renderPage();

  } catch {
    ownersDiv.innerHTML = "<p>Error loading drivers.</p>";
  }
}


/* ================= RENDER PAGE ================= */

function renderPage() {
  ownersDiv.innerHTML = "";

  const start = currentPage * perPage;
  const end = start + perPage;

  const pageItems = allDrivers.slice(start, end);

  pageItems.forEach(driver => {
    const card = createDriverCard(driver);
    ownersDiv.appendChild(card);
  });

  renderPagination();
}


/* ================= DRIVER CARD ================= */



    function createDriverCard(driver) {

  const card = document.createElement("div");
  card.className = "owner-card";

  card.innerHTML = `
    <img src="${driver.profile_pic_url}" alt="Profile">

    <div class="owner-info">
      <strong>${driver.full_name}</strong><br>

      <span class="location">
        ${driver.location}
      </span>

      <div class="phone">
        ${driver.phone_number || ""}
      </div>
    </div>

    <button class="connect-btn">
      ${driver.connect === "connected" ? "Connected" : "Connect"}
    </button>
  `;

  const btn = card.querySelector(".connect-btn");
  const phoneEl = card.querySelector(".phone");

  /* Already connected */
  if (driver.connect === "connected") {

    btn.disabled = true;
    phoneEl.style.display = "block";

    return card;
  }

  /* Connect button */
  btn.onclick = async () => {

    const confirmed = confirm(
      "Are you sure you want to connect to this driver?"
    );

    if (!confirmed) return;

    btn.disabled = true;
    btn.textContent = "Connecting...";

    try {

      const res = await fetch(
        "https://drivers-backend-4spp.onrender.com/connect-driver",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
          },

          body: JSON.stringify({
  connection_id: driver.id
})
        }
      );

      const data = await res.json();

      if (!res.ok) {

        alert(data.error || "Failed to connect");

        btn.disabled = false;
        btn.textContent = "Connect";

        return;
      }

      /* SUCCESS */

      btn.textContent = "Connected";

      phoneEl.style.display = "block";

      alert("Driver connected successfully.");

      showContractForm(card, driver);

    } catch (err) {

      console.log("CONNECT ERROR:", err);

      alert("Network error");

      btn.disabled = false;
      btn.textContent = "Connect";
    }
  };

  return card;
   }
        
/* ================= PAGINATION ================= */

function renderPagination() {
  const totalPages = Math.ceil(allDrivers.length / perPage);

  const nav = document.createElement("div");
  nav.style.textAlign = "center";
  nav.style.marginTop = "15px";

  nav.innerHTML = `
    <button ${currentPage === 0 ? "disabled" : ""}>⬅ Prev</button>
    <span style="margin:0 10px;">
      Page ${currentPage + 1} of ${totalPages}
    </span>
    <button ${currentPage >= totalPages - 1 ? "disabled" : ""}>Next ➡</button>
  `;

  const buttons = nav.querySelectorAll("button");

  buttons[0].onclick = () => {
    currentPage--;
    renderPage();
  };

  buttons[1].onclick = () => {
    currentPage++;
    renderPage();
  };

  ownersDiv.appendChild(nav);
}


/* ================= CONTRACT FORM ================= */

function showContractForm(card, driver) {

  const form = document.createElement("div");
  form.style.marginTop = "10px";

  form.innerHTML = `
    <hr>
    <h4 style="color:var(--main-green)">Create Contract</h4>

    <input type="number" placeholder="Daily amount (KES)" id="amount-${driver.id}" />

    <select id="days-${driver.id}">
      <option value="6">Mon–Sat</option>
      <option value="7">Mon–Sun</option>
    </select>

    <button class="connect-btn">Start Contract</button>
  `;

  const startBtn = form.querySelector("button");

  startBtn.onclick = async () => {

    const amount = document.getElementById(`amount-${driver.id}`).value;
    const days = document.getElementById(`days-${driver.id}`).value;

    if (!amount) {
      alert("Enter amount");
      return;
    }

    try {
      const res = await fetch(
        "https://drivers-backend-4spp.onrender.com/set-contract",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
          },
          body: JSON.stringify({
            driver_id: driver.id,
            daily_amount: Number(amount),
            work_days: Number(days)
          })
        }
      );

      const data = await res.json();

      if (res.ok) {
        form.innerHTML = `
          <p style="color:green;font-weight:bold;">
            Contract sent. Waiting for driver acceptance...
          </p>
        `;
      } else {
        alert(data.error || "Failed");
      }

    } catch {
      alert("Network error");
    }
  };

  card.appendChild(form);
}


/* ================= START APP ================= */

(async () => {
  const registered = await checkRegistration();

  if (registered) {
    loadOwners();
  } else {
    ownersDiv.innerHTML =
      "<p style='color:red;text-align:center'>Complete registration to continue.</p>";
  }
})();




   const contractsDiv = document.getElementById("contracts");

async function loadContracts() {

  try {

    contractsDiv.innerHTML = "<p>Loading contracts...</p>";

    const res = await fetch(
      "https://drivers-backend-4spp.onrender.com/owner-contracts",
      {
        headers: {
          "Authorization": "Bearer " + token
        }
      }
    );

    /* TOKEN EXPIRED */
    if (res.status === 401) {

      localStorage.removeItem("token");

      window.location.href = "partner-login.html";

      return;
    }

    const data = await res.json();

    /* NO ACTIVE CONTRACTS */
    if (!Array.isArray(data) || !data.length) {

      contractsDiv.innerHTML =
        "<p>No active contracts.</p>";

      return;
    }

    contractsDiv.innerHTML = "";

    data.forEach(contract => {

      const card = document.createElement("div");

      card.className = "contract-card";

      card.innerHTML = `

        <div style="
          display:flex;
          gap:12px;
          align-items:center;
        ">

          <img
            src="${contract.driver_profile_pic_url || 'https://via.placeholder.com/70'}"
            style="
              width:70px;
              height:70px;
              border-radius:50%;
              object-fit:cover;
              border:2px solid #1b8f2a;
            "
          >

          <div>

            <strong>
              ${contract.driver_full_name || "Unknown Driver"}
            </strong>

            <br>

            ${contract.driver_phone_number || "No phone"}

            <br>

            <span style="
              color:#1b8f2a;
              font-weight:bold;
            ">
              ${contract.location || "No location"}
            </span>

          </div>

        </div>

        <hr style="margin:10px 0;">

        <strong>Daily Amount:</strong>
        KES ${contract.contract_amount || 0}

        <br><br>

        <strong>Work Days:</strong>
        ${contract.work_days || 0} days/week

        <div
          class="contract-status"
          id="status-${contract.id}"
        >
          Checking payment...
        </div>

        <button class="terminate-btn">
          Terminate
        </button>
        <button class="remittance-btn">
  Open Remittance
</button>

<div class="remittance-container"></div>
      `;

      contractsDiv.appendChild(card);

      /* PAYMENT STATUS */
      checkPaymentStatus(contract.id);

      /* TERMINATE BUTTON */
      const btn = card.querySelector(".terminate-btn");

      btn.onclick = async () => {

        const confirmed = confirm(
          "Terminate contract?"
        );

        if (!confirmed) return;

        try {

          const terminateRes = await fetch(
            "https://drivers-backend-4spp.onrender.com/terminate-contract",
            {
              method: "POST",

              headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + token
              },

              body: JSON.stringify({
                contract_id: contract.id
              })
            }
          );

          const terminateData =
            await terminateRes.json();

          if (!terminateRes.ok) {

            alert(
              terminateData.error ||
              "Failed to terminate"
            );

            return;
          }

          alert("Contract terminated");

          loadContracts();

        } catch (err) {

          console.log(err);

          alert("Network error");
        }
      };
    });

  } catch (err) {

    console.log("LOAD CONTRACTS ERROR:", err);

    contractsDiv.innerHTML =
      "<p>Error loading contracts.</p>";
  }
   }



   /* ================= REMITTANCE BUTTON ================= */

const remittanceBtn =
  card.querySelector(".remittance-btn");

const remittanceContainer =
  card.querySelector(".remittance-container");

remittanceBtn.onclick = async () => {

  if (
    remittanceContainer.innerHTML.trim() !== ""
  ) {

    remittanceContainer.innerHTML = "";

    return;
  }

  renderRemittancePanel(
    remittanceContainer,
    contract
  );
};

      





   async function checkPaymentStatus(contractId) {

  try {
    const res = await fetch(
      `https://drivers-backend-4spp.onrender.com/payment-status/${contractId}`
    );

    const data = await res.json();

    const el = document.getElementById(`status-${contractId}`);

    if (data.paid_today) {
      el.textContent = "✔ Paid Today";
      el.className = "contract-status status-green";
    } else {
      el.textContent = "❌ Not Paid Today";
      el.className = "contract-status status-red";
    }

  } catch {
    console.log("status error");
  }
   }

   (async () => {
  const registered = await checkRegistration();

  if (registered) {
    loadOwners();
    loadContracts(); 
  } else {
    ownersDiv.innerHTML =
      "<p style='color:red;text-align:center'>Complete registration to continue.</p>";
  }
})();


   /* ================= REMITTANCE PANEL ================= */

function renderRemittancePanel(container, contract){

  const today = new Date();

  const currentWeek = getWeekNumber(today);

  const days = [
    "Monday",
    "Tuesday",
    "Wednesday",
    "Thursday",
    "Friday",
    "Saturday",
    "Sunday"
  ];

  container.innerHTML = `

    <div class="remittance-panel">

      <div class="week-title">
        Week ${currentWeek}
      </div>

      <div style="margin-bottom:10px;">
        ${today.toDateString()}
      </div>

      <div class="remittance-legend">

        <div class="legend-item">
          <div class="legend-color day-grey"></div>
          Pending
        </div>

        <div class="legend-item">
          <div class="legend-color day-green"></div>
          Paid
        </div>

        <div class="legend-item">
          <div class="legend-color day-red"></div>
          Unpaid
        </div>

      </div>

      <div class="day-grid" id="days-${contract.id}">
      </div>

      <div class="balance-box" id="balance-${contract.id}">
        Balance: KES 0
      </div>

    </div>
  `;

  const daysContainer =
    document.getElementById(`days-${contract.id}`);

  days.forEach(day => {

    const btn = document.createElement("button");

    btn.className = "day-btn day-grey";

    btn.innerHTML = day;

    btn.onclick = async () => {

      const received = confirm(
        `Did you receive payment for ${day}?`
      );

      if (!received) {

        btn.className = "day-btn day-red";

        return;
      }

      const fullPayment = confirm(
        "Was it full payment?"
      );

      let paidAmount =
        Number(contract.contract_amount);

      if (!fullPayment) {

        const partial =
          prompt("How much was paid?");

        paidAmount = Number(partial || 0);
      }

      const balance =
        Number(contract.contract_amount)
        - paidAmount;

      if (paidAmount > 0) {

        btn.className =
          "day-btn day-green";

      } else {

        btn.className =
          "day-btn day-red";
      }

      document.getElementById(
        `balance-${contract.id}`
      ).innerHTML = `
        Balance:
        KES ${balance}
      `;

      /* CREATE REMITTANCE DAY */

      try {

        await fetch(
          "https://drivers-backend-4spp.onrender.com/create-remittance-day",
          {
            method:"POST",

            headers:{
              "Content-Type":"application/json",
              "Authorization":
                "Bearer " + token
            },

            body:JSON.stringify({
              connection_id: contract.id
            })
          }
        );

      } catch(err){

        console.log(
          "REMINTTANCE ERROR:",
          err
        );
      }
    };

    daysContainer.appendChild(btn);
  });
   }




   /* ================= WEEK NUMBER ================= */

function getWeekNumber(date){

  const firstDay =
    new Date(date.getFullYear(), 0, 1);

  const pastDays =
    (date - firstDay) / 86400000;

  return Math.ceil(
    (pastDays + firstDay.getDay() + 1) / 7
  );
   }
