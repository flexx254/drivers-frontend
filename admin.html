<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set Purpose Figures</title>
<style>
  body { font-family: Arial, sans-serif; padding: 20px; background: #f7f7f7; }
  .container { background: #fff; padding: 20px; border-radius: 8px; max-width: 500px; margin: auto; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
  label { display: block; margin-top: 15px; font-weight: bold; }
  input[type="number"], input[type="date"] { width: 100%; padding: 8px; margin-top: 5px; }
  button { margin-top: 20px; padding: 10px 20px; background: #4CAF50; color: #fff; border: none; border-radius: 5px; cursor: pointer; }
  button:hover { background: #45a049; }
  .message { margin-top: 15px; font-weight: bold; }
  .error { color: red; }
  .success { color: green; }
</style>
</head>
<body>

<div class="container">
  <h2>Set Purpose Figures</h2>
  <form id="purposeForm">
    <label>Registration Total</label>
    <input type="number" id="registration_total" required>

    <label>Registration Deadline</label>
    <input type="date" id="registration_deadline" required>

    <label>Partner Connection Total</label>
    <input type="number" id="partner_connection_total" required>

    <label>Partner Connection Deadline</label>
    <input type="date" id="partner_connection_deadline" required>

    <label>Insurance Total</label>
    <input type="number" id="insurance_total" required>

    <label>Insurance Deadline</label>
    <input type="date" id="insurance_deadline" required>

    <button type="submit">Update Figures</button>
  </form>

  <div class="message" id="message"></div>
</div>

<script>
const backendURL = "https://drivers-backend-4spp.onrender.com/set-purpose-figures";
const form = document.getElementById("purposeForm");
const messageDiv = document.getElementById("message");

// Fetch current purpose figures on load
async function loadCurrentFigures() {
  try {
    const resp = await fetch(`${backendURL}/get-purpose-figures`);
    const data = await resp.json();
    if (data.success && data.purpose) {
      const p = data.purpose;
      document.getElementById("registration_total").value = p.registration_total;
      document.getElementById("registration_deadline").value = p.registration_deadline;
      document.getElementById("partner_connection_total").value = p.partner_connection_total;
      document.getElementById("partner_connection_deadline").value = p.partner_connection_deadline;
      document.getElementById("insurance_total").value = p.insurance_total;
      document.getElementById("insurance_deadline").value = p.insurance_deadline;
    }
  } catch (err) {
    console.error(err);
    messageDiv.textContent = "Failed to load current figures";
    messageDiv.className = "message error";
  }
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  messageDiv.textContent = "";
  const payload = {
    registration_total: document.getElementById("registration_total").value,
    registration_deadline: document.getElementById("registration_deadline").value,
    partner_connection_total: document.getElementById("partner_connection_total").value,
    partner_connection_deadline: document.getElementById("partner_connection_deadline").value,
    insurance_total: document.getElementById("insurance_total").value,
    insurance_deadline: document.getElementById("insurance_deadline").value,
  };

  try {
    const resp = await fetch(`${backendURL}/set-purpose-figures`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    const result = await resp.json();
    if (result.success) {
      messageDiv.textContent = result.message;
      messageDiv.className = "message success";
    } else {
      messageDiv.textContent = result.error;
      messageDiv.className = "message error";
    }
  } catch (err) {
    messageDiv.textContent = "Server error";
    messageDiv.className = "message error";
  }
});

// Load current figures on page load
loadCurrentFigures();
</script>

</body>
</html>
