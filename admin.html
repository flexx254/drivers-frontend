<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin: Update Purposes</title>
<style>
    body { font-family: Arial; background: #f5f5f5; margin: 0; padding: 0; }
    .container { max-width: 600px; margin: 50px auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0px 3px 10px rgba(0,0,0,0.2); }
    h2 { color: #1b8f2a; text-align: center; margin-bottom: 20px; }
    label { display: block; margin-top: 15px; font-weight: bold; }
    input { width: 100%; padding: 10px; margin-top: 5px; border-radius: 4px; border: 1px solid #ccc; }
    button { background: #1b8f2a; color: white; border: none; padding: 12px 20px; margin-top: 20px; border-radius: 6px; cursor: pointer; width: 100%; font-size: 16px; }
    button:hover { background: #166f20; }
    #message { margin-top: 20px; text-align: center; font-weight: bold; }
</style>
</head>
<body>

<div class="container">
    <h2>Update Purpose Totals & Deadlines</h2>
    <form id="purposeForm">
        <label for="registration_total">Registration Total</label>
        <input type="number" id="registration_total" required>
        <label for="registration_deadline">Registration Deadline</label>
        <input type="date" id="registration_deadline" required>

        <label for="partner_connection_total">Partner Connection Total</label>
        <input type="number" id="partner_connection_total" required>
        <label for="partner_connection_deadline">Partner Connection Deadline</label>
        <input type="date" id="partner_connection_deadline" required>

        <label for="insurance_total">Insurance Total</label>
        <input type="number" id="insurance_total" required>
        <label for="insurance_deadline">Insurance Deadline</label>
        <input type="date" id="insurance_deadline" required>

        <button type="submit">Update</button>
    </form>
    <div id="message"></div>
</div>

<script>
const backendURL = 'https://drivers-backend-4spp.onrender.com';

// Load current values on page load
async function loadCurrentValues() {
    try {
        const res = await fetch(`${backendURL}/admin/get-purposes`);
        const data = await res.json();
        if (data.success && data.purposes) {
            document.getElementById('registration_total').value = data.purposes.registration_total || 0;
            document.getElementById('registration_deadline').value = data.purposes.registration_deadline || '';
            document.getElementById('partner_connection_total').value = data.purposes.partner_connection_total || 0;
            document.getElementById('partner_connection_deadline').value = data.purposes.partner_connection_deadline || '';
            document.getElementById('insurance_total').value = data.purposes.insurance_total || 0;
            document.getElementById('insurance_deadline').value = data.purposes.insurance_deadline || '';
        } else {
            showMessage("Failed to load current values", "red");
        }
    } catch(err) {
        showMessage("Server error: " + err.message, "red");
    }
}

function showMessage(msg, color) {
    const el = document.getElementById('message');
    el.style.color = color;
    el.textContent = msg;
}

// Handle form submission
document.getElementById('purposeForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    showMessage("Updating...", "black");

    const payload = {
        registration_total: Number(document.getElementById('registration_total').value),
        registration_deadline: document.getElementById('registration_deadline').value,
        partner_connection_total: Number(document.getElementById('partner_connection_total').value),
        partner_connection_deadline: document.getElementById('partner_connection_deadline').value,
        insurance_total: Number(document.getElementById('insurance_total').value),
        insurance_deadline: document.getElementById('insurance_deadline').value
    };

    try {
        const res = await fetch(`${backendURL}/admin/update-purposes`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.success) {
            showMessage(data.message, "green");
        } else {
            showMessage(data.error || "Update failed", "red");
        }
    } catch(err) {
        showMessage("Server error: " + err.message, "red");
    }
});

// Load current values when page opens
loadCurrentValues();
</script>

</body>
</html>
