<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Continue Partner Registration</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root {
  --main-green: #1b8f2a;
  --white: #ffffff;
  --danger: #a30000;
}

body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f5f5f5;
}

/* HEADER */
header {
  background-color: var(--main-green);
  color: var(--white);
  padding: 15px 20px;
  display: flex;
  align-items: center;
}

header img {
  height: 32px;
}

/* FORM CONTAINER */
.container {
  max-width: 500px;
  margin: 20px auto;
  background: white;
  padding: 22px;
  border-radius: 10px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.12);
}

h2 {
  color: var(--main-green);
  text-align: center;
  margin-bottom: 20px;
}

label {
  font-weight: bold;
  color: var(--main-green);
  display: block;
  margin-bottom: 6px;
}

input {
  width: 100%;
  padding: 12px;
  border: 2px solid var(--main-green);
  border-radius: 8px;
  font-size: 16px;
  margin-bottom: 16px;
}

/* PREVIEW */
img.preview {
  width: 120px;
  height: 120px;
  object-fit: cover;
  display: none;
  margin-bottom: 15px;
  border: 2px solid var(--main-green);
  border-radius: 8px;
}

/* BUTTON */
button {
  width: 100%;
  background: var(--main-green);
  color: white;
  padding: 14px;
  border: none;
  border-radius: 8px;
  font-size: 18px;
  cursor: pointer;
}

button:active {
  background: #166d20;
}

/* MESSAGE */
.msg {
  display: none;
  padding: 12px;
  margin-top: 15px;
  border-radius: 8px;
  font-size: 15px;
}

.success {
  background: #d8ffd8;
  color: #0f6e12;
}

.error {
  background: #ffd6d6;
  color: var(--danger);
}

/* FOOTER */
footer {
  background-color: var(--main-green);
  color: white;
  text-align: center;
  padding: 15px;
  margin-top: 30px;
}
</style>
</head>

<body>

<header>
  <img src="assets/logo/d4d-logo.png" alt="D4D Logo">
</header>

<div class="container">
<h2>Vehicle & Documents</h2>

<form id="partnerContinueForm" enctype="multipart/form-data">

<label>Car Number Plate</label>
<input type="text" id="number_plate" placeholder="e.g. KDK 123A">

<label>Car Make</label>
<input type="text" id="car_make" placeholder="e.g. Toyota">

<label>Car Model</label>
<input type="text" id="car_model" placeholder="e.g. Vitz">

<label>Upload Car Image</label>
<img id="car_preview" class="preview">
<input type="file" id="car_image" accept="image/*">

<label>Upload Logbook</label>
<img id="logbook_preview" class="preview">
<input type="file" id="logbook" accept="image/*,application/pdf">

<label>Upload Inspection Report</label>
<img id="inspection_preview" class="preview">
<input type="file" id="inspection_report" accept="image/*,application/pdf">

<label>Upload Uber Report <small>(Optional)</small></label>
<img id="uber_preview" class="preview">
<input type="file" id="uber_report" accept="image/*,application/pdf">

<button type="button" onclick="submitPartnerDetails()">Submit Details</button>

<div id="msgBox" class="msg"></div>

</form>
</div>

<footer>
&copy; 2025 D4D – Drivers for Drivers
</footer>

<script>
/* ============================= */
/* 🔐 JWT PROTECTION */
/* ============================= */

const TOKEN_KEY = "token";
const token = localStorage.getItem(TOKEN_KEY);

// If no token → redirect to login
if (!token) {
  window.location.href = "partner-login.html";
}

/* ============================= */
/* MESSAGE SYSTEM */
/* ============================= */

const msgBox = document.getElementById("msgBox");

function showMessage(text, type) {
  msgBox.textContent = text;
  msgBox.className = "msg " + type;
  msgBox.style.display = "block";
}

/* ============================= */
/* IMAGE PREVIEW */
/* ============================= */

function setupPreview(inputId, previewId) {
  document.getElementById(inputId).addEventListener("change", function () {
    if (this.files[0] && this.files[0].type.startsWith("image/")) {
      const img = document.getElementById(previewId);
      img.src = URL.createObjectURL(this.files[0]);
      img.style.display = "block";
    }
  });
}

setupPreview("car_image", "car_preview");
setupPreview("logbook", "logbook_preview");
setupPreview("inspection_report", "inspection_preview");
setupPreview("uber_report", "uber_preview");

/* ============================= */
/* SUBMIT CONTINUE REGISTRATION */
/* ============================= */

async function submitPartnerDetails() {

  const number_plate = document.getElementById("number_plate").value.trim();
  const car_make = document.getElementById("car_make").value.trim();
  const car_model = document.getElementById("car_model").value.trim();

  const car_image = document.getElementById("car_image").files[0];
  const logbook = document.getElementById("logbook").files[0];
  const inspection = document.getElementById("inspection_report").files[0];
  const uber = document.getElementById("uber_report").files[0];

  if (!number_plate || !car_make || !car_model || !car_image || !logbook || !inspection) {
    showMessage("Please complete all required fields.", "error");
    return;
  }

  const formData = new FormData();
  formData.append("number_plate", number_plate);
  formData.append("car_make", car_make);
  formData.append("car_model", car_model);
  formData.append("car_image", car_image);
  formData.append("logbook", logbook);
  formData.append("inspection_report", inspection);
  if (uber) formData.append("uber_report", uber);

  try {
    showMessage("Submitting details...", "success");

    const res = await fetch(
      "https://drivers-backend-4spp.onrender.com/continue-partner-reg",
      {
        method: "POST",
        headers: {
          "Authorization": "Bearer " + token
        },
        body: formData
      }
    );

    // 🔒 If token expired or invalid
    if (res.status === 401) {
      localStorage.removeItem(TOKEN_KEY);
      window.location.href = "partner-login.html";
      return;
    }

    const data = await res.json();

    if (!res.ok) {
      showMessage(data.error || "Submission failed.", "error");
      return;
    }

    showMessage("Partner registration completed successfully.", "success");

    // ✅ Redirect to dashboard after success
    setTimeout(() => {
      window.location.href = "owner-dashboard.html";
    }, 1500);

  } catch (err) {
    showMessage("Network error. Please try again.", "error");
  }
}
</script>


    

</body>
</html>
