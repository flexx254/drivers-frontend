<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: sans-serif;
}

:root {
  --main-green: #006400;
  --light-green: #228B22;
  --white: #ffffff;
}

body {
  background-color: #f5f5f5;
  color: #333;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  background-color: var(--main-green);
  color: var(--white);
  padding: 15px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header .logo img {
  height: 32px;
}

header .menu-icon {
  font-size: 24px;
  cursor: pointer;
  display: none;
}

nav {
  display: flex;
  gap: 20px;
}

nav a {
  color: var(--white);
  text-decoration: none;
}

nav.active {
  display: block;
  position: absolute;
  top: 60px;
  right: 20px;
  background-color: var(--main-green);
  padding: 15px;
  border-radius: 5px;
}

.container {
  flex: 1;
  max-width: 400px;
  margin: 40px auto;
  background-color: #fff;
  padding: 30px;
  border-radius: 8px;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

h2 {
  text-align: center;
  color: var(--main-green);
  margin-bottom: 20px;
}

input, button {
  width: 100%;
  padding: 10px;
  margin: 10px 0;
  border-radius: 5px;
  border: 1px solid #ccc;
  font-size: 16px;
}

button {
  background-color: var(--main-green);
  color: white;
  border: none;
  cursor: pointer;
}

button.loading {
  pointer-events: none;
  opacity: 0.7;
}

button.loading::after {
  content: "";
  width: 18px;
  height: 18px;
  border: 3px solid white;
  border-top: 3px solid transparent;
  border-radius: 50%;
  position: absolute;
  right: 15px;
  top: 50%;
  transform: translateY(-50%);
  animation: spin 0.7s linear infinite;
}

@keyframes spin {
  to { transform: translateY(-50%) rotate(360deg); }
}

.password-wrapper {
  position: relative;
}

.toggle-eye {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  cursor: pointer;
}

#errorBox {
  color: red;
  white-space: pre-line;
  text-align: center;
}

#successBox {
  color: green;
  text-align: center;
}

footer {
  background-color: var(--main-green);
  color: white;
  text-align: center;
  padding: 15px;
}
</style>
</head>

<body>

<header>
  <div class="logo">
    <img src="assets/logo/d4d-logo.png" alt="D4D Logo">
  </div>
</header>

<div class="container">
  <h2>Create Account</h2>

  <input id="name" placeholder="Enter full name">
  <input id="email" placeholder="Enter email">

  <input id="phone_number" type="tel" value="+254"
         placeholder="+2547xxxxxxxx"
         oninput="autoInsertPrefix()">

  <div class="password-wrapper">
    <input id="password" type="password" placeholder="Enter password">
    <span class="toggle-eye" onclick="togglePassword('password', this)">👁️</span>
  </div>

  <div class="password-wrapper">
    <input id="confirm" type="password" placeholder="Confirm password">
    <span class="toggle-eye" onclick="togglePassword('confirm', this)">👁️</span>
  </div>

  <button onclick="registerUser()">Submit</button>

  <div id="errorBox"></div>
  <div id="successBox"></div>
</div>

<footer>
  &copy; 2025 Driver App. All rights reserved.
</footer>

<script>
function togglePassword(id, el) {
  const input = document.getElementById(id);
  input.type = input.type === "password" ? "text" : "password";
  el.textContent = input.type === "password" ? "👁️" : "🙈";
}

function validateFrontend(name, email, phone, password, confirm) {
  let errors = [];

  if (!name) errors.push("Name is required.");
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) errors.push("Valid email required.");
  if (!/^\+254\d{9}$/.test(phone)) errors.push("Phone must be +254XXXXXXXXX.");

  if (password.length < 8) errors.push("Password must be at least 8 characters.");
  if (!/[A-Z]/.test(password)) errors.push("One uppercase letter required.");
  if (!/[a-z]/.test(password)) errors.push("One lowercase letter required.");
  if (!/\d/.test(password)) errors.push("One number required.");
  if (!/[!@#$%^&*]/.test(password)) errors.push("One special character required.");
  if (password !== confirm) errors.push("Passwords do not match.");

  return errors;
}

async function registerUser() {
  const btn = document.querySelector("button");
  btn.classList.add("loading");

  const name = nameEl.value.trim();
  const email = emailEl.value.trim().toLowerCase();
  const phone_number = phone_numberEl.value.trim();
  const password = passwordEl.value;
  const confirm = confirmEl.value;

  const errors = validateFrontend(name, email, phone_number, password, confirm);
  if (errors.length) {
    errorBox.textContent = errors.join("\n");
    btn.classList.remove("loading");
    return;
  }

  try {
    const res = await fetch(
      "https://drivers-backend-4spp.onrender.com/register-owner",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, email, phone_number, password, confirm })
      }
    );

    const data = await res.json();
    if (!data.success) throw data.error;

    successBox.textContent = "Registration complete ✔";
  } catch (e) {
    errorBox.textContent = e;
  } finally {
    btn.classList.remove("loading");
  }
}

let firstTyped = false;
function autoInsertPrefix() {
  if (!firstTyped) {
    firstTyped = true;
    phone_numberEl.value = "+254";
    return;
  }
  const digits = phone_numberEl.value.replace(/\D/g, "").slice(3, 12);
  phone_numberEl.value = "+254" + digits;
}

const nameEl = document.getElementById("name");
const emailEl = document.getElementById("email");
const phone_numberEl = document.getElementById("phone_number");
const passwordEl = document.getElementById("password");
const confirmEl = document.getElementById("confirm");
const errorBox = document.getElementById("errorBox");
const successBox = document.getElementById("successBox");
</script>

</body>
</html>
