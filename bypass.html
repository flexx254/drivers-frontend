<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Update Location</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root {
  --main-green: #1b8f2a;
  --white: #ffffff;
}

body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f5f5f5;
}

/* HEADER */
header {
  background-color: var(--main-green);
  color: var(--white);
  padding: 15px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header img {
  height: 32px;
}

/* CONTAINER */
.container {
  max-width: 500px;
  margin: 30px auto;
  background: white;
  padding: 22px;
  border-radius: 10px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.12);
}

h2 {
  color: var(--main-green);
  text-align: center;
  margin-bottom: 20px;
}

label {
  font-weight: bold;
  display: block;
  margin-bottom: 6px;
}

input {
  width: 100%;
  padding: 12px;
  border: 2px solid var(--main-green);
  border-radius: 8px;
  font-size: 16px;
  margin-bottom: 18px;
}

button {
  width: 100%;
  background: var(--main-green);
  color: white;
  padding: 14px;
  border: none;
  border-radius: 8px;
  font-size: 18px;
  cursor: pointer;
}

button:active {
  background: #166d20;
}

.msg {
  margin-top: 15px;
  font-weight: bold;
  text-align: center;
}

/* FOOTER */
footer {
  background-color: var(--main-green);
  color: var(--white);
  text-align: center;
  padding: 15px;
  margin-top: 40px;
}
</style>
</head>

<body>

<header>
  <img src="assets/logo/d4d-logo.png" alt="D4D Logo">
</header>

<div class="container">
  <h2>Update Location</h2>

  <label for="record_id">ID (int8)</label>
  <input type="number" id="record_id" placeholder="Enter ID">

  <label for="location">Location</label>
  <input type="text" id="location" placeholder="e.g. Donholm, Nairobi">

  <button onclick="updateLocation()">Save Location</button>

  <div id="msg" class="msg"></div>
</div>

<footer>
  &copy; 2025 D4D Platform
</footer>

<script>
async function updateLocation() {
  const id = document.getElementById("record_id").value.trim();
  const location = document.getElementById("location").value.trim();
  const msg = document.getElementById("msg");

  msg.textContent = "";
  msg.style.color = "red";

  if (!id || !location) {
    msg.textContent = "Both ID and location are required.";
    return;
  }

  try {
    const res = await fetch("https://your-backend-url/update-location", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        id: Number(id),
        location: location
      })
    });

    const data = await res.json();

    if (!data.success) {
      msg.textContent = data.error || "ID not found.";
      return;
    }

    msg.style.color = "green";
    msg.textContent = "Location updated successfully.";

    document.getElementById("location").value = "";

  } catch (err) {
    msg.textContent = "Network error. Try again.";
  }
}
</script>

</body>
</html>
