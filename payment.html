<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: sans-serif;
}

/* THEME COLORS */
:root {
  --main-green: #006400;
  --light-green: #228B22;
  --white: #ffffff;
}

/* BODY */
body {
  background-color: #f5f5f5;
  color: #333;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* HEADER */
header {
  background-color: var(--main-green);
  color: var(--white);
  padding: 15px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header .logo img {
  height: 32px;
}

/* CONTAINER */
.container {
  flex: 1;
  max-width: 400px;
  margin: 40px auto;
  background: #fff;
  padding: 30px;
  border-radius: 8px;
  box-shadow: 0 0 10px rgba(0,0,0,.1);
}

h2 {
  text-align: center;
  color: var(--main-green);
  margin-bottom: 20px;
}

input, select, button {
  width: 100%;
  padding: 10px;
  margin: 10px 0;
  font-size: 16px;
  border-radius: 5px;
  border: 1px solid #ccc;
}

input[readonly] {
  background: #eee;
}

button {
  background: var(--main-green);
  color: white;
  border: none;
  cursor: pointer;
}

button:hover {
  background: var(--light-green);
}

/* OVERLAY */
#paymentOverlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.6);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 999;
}

.overlay-box {
  background: white;
  padding: 25px;
  border-radius: 8px;
  width: 90%;
  max-width: 320px;
  text-align: center;
}

.spinner {
  margin: 20px auto;
  width: 40px;
  height: 40px;
  border: 4px solid #ccc;
  border-top: 4px solid var(--main-green);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* FOOTER */
footer {
  background: var(--main-green);
  color: white;
  text-align: center;
  padding: 15px;
}
</style>
</head>

<body>

<header>
  <div class="logo">
    <img src="assets/logo/d4d-logo.png" alt="D4D">
  </div>
</header>

<div class="container">
  <h2>Make Payment</h2>

  <label>Full Name</label>
  <input id="fullName" readonly>

  <label>MPESA Number</label>
  <input id="mpesa" placeholder="+2547XXXXXXXX">

  <label>Purpose of Payment</label>
  <select id="purpose">
    <option value="">Select purpose</option>
    <option value="registration">Registration</option>
    <option value="partner_connection">Partner Connection</option>
    <option value="insurance">Insurance</option>
  </select>

  <button onclick="startPayment()">Proceed to Pay</button>
</div>

<footer>
  &copy; 2025 Driver App
</footer>

<!-- PAYMENT OVERLAY -->
<div id="paymentOverlay">
  <div class="overlay-box">
    <h3>Send Payment</h3>
    <p>
      Send money via MPESA to:<br>
      <strong>0728 639 425</strong>
    </p>

    <div class="spinner"></div>

    <p>Waiting for payment confirmation…</p>
  </div>
</div>

<script>
/* LOAD USER NAME */
async function loadUser() {
  try {
    const res = await fetch("https://drivers-backend-4spp.onrender.com/me", {
      credentials: "include"
    });

    const data = await res.json();
    if (data.full_name) {
      document.getElementById("fullName").value = data.full_name;
    }
  } catch (e) {
    console.error(e);
  }
}
loadUser();

/* START PAYMENT */
let poller = null;

async function startPayment() {
  const mpesa = document.getElementById("mpesa").value.trim();
  const purpose = document.getElementById("purpose").value;

  if (!/^\+254\d{9}$/.test(mpesa)) {
    alert("Enter valid MPESA number");
    return;
  }

  if (!purpose) {
    alert("Select payment purpose");
    return;
  }

  document.getElementById("paymentOverlay").style.display = "flex";

  const res = await fetch("https://drivers-backend-4spp.onrender.com/start-payment", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    credentials: "include",
    body: JSON.stringify({ mpesa, purpose })
  });

  const data = await res.json();
  if (!data.reference) return;

  poller = setInterval(() => checkPayment(data.reference), 5000);
}

/* POLL PAYMENT STATUS */
async function checkPayment(reference) {
  const res = await fetch(
    `https://drivers-backend-4spp.onrender.com/check-payment?ref=${reference}`,
    { credentials: "include" }
  );

  const data = await res.json();

  if (data.status === "paid") {
    clearInterval(poller);
    alert("Payment confirmed ✔");
    window.location.href = "/dashboard";
  }
}
</script>

</body>
</html>
