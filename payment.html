<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: sans-serif;
}

:root {
  --main-green: #006400;
  --light-green: #228B22;
}

body {
  background: #f5f5f5;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

header, footer {
  background: var(--main-green);
  color: white;
  padding: 15px;
  text-align: center;
}

.container {
  flex: 1;
  max-width: 400px;
  margin: 40px auto;
  background: white;
  padding: 30px;
  border-radius: 8px;
}

h2 {
  text-align: center;
  color: var(--main-green);
  margin-bottom: 20px;
}

input, select, button {
  width: 100%;
  padding: 10px;
  margin: 10px 0;
}

button {
  background: var(--main-green);
  color: white;
  border: none;
  cursor: pointer;
}

button:hover {
  background: var(--light-green);
}

#paymentOverlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.6);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 999;
}

.overlay-box {
  background: white;
  padding: 25px;
  border-radius: 8px;
  width: 90%;
  max-width: 320px;
  text-align: center;
}

.spinner {
  margin: 20px auto;
  width: 40px;
  height: 40px;
  border: 4px solid #ccc;
  border-top: 4px solid var(--main-green);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.status {
  margin-top: 10px;
  font-weight: bold;
}
.success { color: green; }
.error { color: red; }
</style>
</head>

<body>

<header>Driver App</header>

<div class="container">
  <h2>Make Payment</h2>

  <label>MPESA Number</label>
  <input id="mpesa" placeholder="+2547XXXXXXXX">

  <label>Purpose</label>
  <select id="purpose">
    <option value="">Select</option>
    <option value="registration">Registration</option>
    <option value="partner_connection">Partner Connection</option>
    <option value="insurance">Insurance</option>
  </select>

  <button onclick="startPayment()">Proceed to Pay</button>
</div>

<footer>&copy; 2025 Driver App</footer>

<!-- OVERLAY -->
<div id="paymentOverlay">
  <div class="overlay-box">
    <h3>Send MPESA Payment</h3>
    <p>Pay to <strong>0728 639 425</strong></p>
    <div class="spinner"></div>
    <div id="statusText" class="status">Creating payment intent…</div>
  </div>
</div>

<script>
const mpesaInput = document.getElementById("mpesa");
const purposeSelect = document.getElementById("purpose");
const paymentOverlay = document.getElementById("paymentOverlay");
const statusText = document.getElementById("statusText");

let pollingInterval = null;
let pollingTimeout = null;

/* =========================
   CHECK LOGIN FIRST
========================= */
const token = localStorage.getItem("token");

if (!token) {
  alert("Session expired. Please login again.");
  window.location.href = "login.html";
}

/* =========================
   START PAYMENT
========================= */
async function startPayment() {

  const phone = mpesaInput.value.trim();
  const purpose = purposeSelect.value;

  if (!/^\+254\d{9}$/.test(phone)) {
    alert("Invalid MPESA number. Use +2547XXXXXXXX format.");
    return;
  }

  if (!purpose) {
    alert("Select purpose");
    return;
  }

  paymentOverlay.style.display = "flex";
  statusText.textContent = "Creating payment intent…";
  statusText.className = "status";

  try {

    const res = await fetch(
      "https://drivers-backend-4spp.onrender.com/create-payment-intent",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + token
        },
        body: JSON.stringify({ phone, purpose })
      }
    );

    if (res.status === 401) {
      alert("Unauthorized. Please login again.");
      localStorage.removeItem("token");
      window.location.href = "login.html";
      return;
    }

    const data = await res.json();

    if (data.status === "ok" && data.reference) {

      statusText.textContent = "Waiting for MPESA confirmation...";
      statusText.className = "status";

      startPolling(data.reference);

    } else {
      showError("Failed to create payment intent");
    }

  } catch (err) {
    showError("Network error. Try again.");
  }
}

/* =========================
   POLLING FUNCTION
========================= */
function startPolling(reference) {

  pollingTimeout = setTimeout(() => {
    stopPolling();
    showError("Payment timeout. Please try again.");
  }, 120000);

  pollingInterval = setInterval(async () => {

    try {

      const res = await fetch(
        "https://drivers-backend-4spp.onrender.com/check-payment-status",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
          },
          body: JSON.stringify({ reference })
        }
      );

      if (res.status === 401) {
        alert("Session expired. Please login again.");
        stopPolling();
        localStorage.removeItem("token");
        window.location.href = "login.html";
        return;
      }

      const data = await res.json();

      if (data.status === "paid") {

        stopPolling();

        statusText.textContent = "Payment Successful ✔";
        statusText.className = "status success";

        setTimeout(() => {
          paymentOverlay.style.display = "none";
          window.location.href = "dashboard.html";
        }, 3000);
      }

    } catch (err) {
      stopPolling();
      showError("Error checking payment status.");
    }

  }, 5000);
}

/* =========================
   STOP POLLING
========================= */
function stopPolling() {
  if (pollingInterval) {
    clearInterval(pollingInterval);
    pollingInterval = null;
  }
  if (pollingTimeout) {
    clearTimeout(pollingTimeout);
    pollingTimeout = null;
  }
}

/* =========================
   ERROR HANDLER
========================= */
function showError(message) {
  stopPolling();
  statusText.textContent = message;
  statusText.className = "status error";

  setTimeout(() => {
    paymentOverlay.style.display = "none";
  }, 3000);
}
  </script>
</body>
</html>
