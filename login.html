<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Driver Login</title>

<meta
  http-equiv="Content-Security-Policy"
  content="
    default-src 'self';
    base-uri 'self';
    object-src 'none';
    form-action 'self';
    script-src 'self';
    style-src 'self' https://cdnjs.cloudflare.com;
    font-src 'self' https://cdnjs.cloudflare.com data:;
    img-src 'self' data:;
    connect-src 'self' https://drivers-backend-4spp.onrender.com;
  "
>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="css/login.css">



</head>
<body>

   <header>

  <div class="logo">
  <img src="assets/logo/d4d-logo.png" alt="D4D Logo">
  </div>
  <div class="menu-icon" id="menuToggle"><i class="fas fa-bars"></i></div>
  <nav id="navMenu">
    <a href="#">Home</a>
    <a href="#">Login</a>
    <a href="#">About</a>
  </nav>
   </header>

<div class="container">
<h2>Driver Login</h2>

<label for="email">Email</label>
<input type="email" id="email" placeholder="you@example.com">

<label for="password">Password</label>
<div class="password-wrapper">
  <input type="password" id="password" placeholder="Enter your password">
  <span id="togglePass" class="toggle-pass">&#128065;</span>
</div>

<button id="loginBtn">
  Login
  <span class="spinner" id="btnSpinner"></span>
</button>
<div id="msgBox" class="msg"></div>
</div>

  <footer>
  &copy; 2025 Driver App. All rights reserved.
  </footer>

<div class="desktop-overlay" aria-hidden="true">
  <div class="overlay-content">
    <i class="fas fa-mobile-alt"></i>
    <h2>Mobile Access Only</h2>
    <p>
      D4D is currently optimized for mobile devices.
      Please open this page on a smartphone for the best experience.
    </p>
  </div>
</div>

<script src="js/login.js" defer></script>

</body>
</html>
