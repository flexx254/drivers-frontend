<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Driver Login</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"> 
<link rel="stylesheet" href="css/login.css">


</head>
<body>

   <header>

  <div class="logo">
  <img src="assets/logo/d4d-logo.png" alt="D4D Logo">
  </div>
  <div class="menu-icon" id="menuToggle"><i class="fas fa-bars"></i></div>
  <nav id="navMenu">
    <a href="#">Home</a>
    <a href="#">Login</a>
    <a href="#">About</a>
  </nav>
   </header>

<div class="container">
<h2>Driver Login</h2>

<label for="email">Email</label>
<input type="email" id="email" placeholder="you@example.com">

<label for="password">Password</label>
<div class="password-wrapper">
  <input type="password" id="password" placeholder="Enter your password">
  <span id="togglePass" class="toggle-pass">&#128065;</span>
</div>

<button id="loginBtn">
  Login
  <span class="spinner" id="btnSpinner"></span>
</button>
<div id="msgBox" class="msg"></div>
</div>

  <footer>
  &copy; 2025 Driver App. All rights reserved.
  </footer>

<div class="desktop-overlay" aria-hidden="true">
  <div class="overlay-content">
    <i class="fas fa-mobile-alt"></i>
    <h2>Mobile Access Only</h2>
    <p>
      D4D is currently optimized for mobile devices.
      Please open this page on a smartphone for the best experience.
    </p>
  </div>
</div>

<script>

const toggle = document.getElementById("togglePass");
const pwd = document.getElementById("password");

toggle.addEventListener("click", () => {
  if (pwd.type === "password") {
    pwd.type = "text";
    toggle.textContent = "👁️";
  } else {
    pwd.type = "password";
    toggle.textContent = "🙈";
  }
});

function showMessage(text, type){
    const msg = document.getElementById("msgBox");
    msg.textContent = text;
    msg.className = `msg ${type}`;
    msg.style.display = "block";
}

async function login(){
    const email = document.getElementById("email").value.trim().toLowerCase();
    const password = document.getElementById("password").value;
    const btn = document.getElementById("loginBtn");
    const spinner = document.getElementById("btnSpinner");

    if(!email){ showMessage("Email is required","error"); return; }
    if(!password){ showMessage("Password is required","error"); return; }

    btn.disabled = true;
    spinner.style.display = "inline-block";

    try{
        const res = await fetch("https://drivers-backend-4spp.onrender.com/login", {
            method:"POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        // 🔥 UPDATED PART
        if(res.ok && data.access_token){
            showMessage("Login successful! Redirecting...", "success");

            // Save real JWT
            localStorage.setItem("token", data.access_token);

            // Redirect immediately
            window.location.href = "driver-search.html";
        } 
        else {
            showMessage(data.error || "Invalid credentials", "error");
        }

    } catch(e){
        showMessage("Network error. Try again.", "error");
    }

    btn.disabled = false;
    spinner.style.display = "none";
}

document.getElementById("loginBtn").addEventListener("click", login);

// ---------------------
// RESPONSIVE MENU
// ---------------------
const menuToggle = document.getElementById('menuToggle');
const navMenu = document.getElementById('navMenu');

menuToggle.addEventListener('click', () => {
  navMenu.classList.toggle('active');
  menuToggle.innerHTML = navMenu.classList.contains('active') 
    ? '<i class="fas fa-times"></i>' 
    : '<i class="fas fa-bars"></i>';
});

</script>
</body>
</html>
